[config]

# The blocks `asura theme render -c` fills from the palette the daemon hands it.
# colors.json, the shell's own palette, is not a block: the daemon writes it.
# These always render; apps.toml renders only while "Theme apps" is on.
#
# input_path is the materialised overlay (~/.config/asura/shell/matugen/...), so a
# user edit wins; before `asura materialize` has run, the packaged copy under
# /usr/share/asura is read instead. Only apps Asura ships have a block here.

# The terminal. The file lives in Asura's own directory and apps/ghostty/config
# includes it with `config-file = colors`.
[templates.ghostty]
input_path = "~/.config/asura/shell/matugen/templates/ghostty.conf"
output_path = "~/.config/asura/apps/ghostty/colors"

# apps/btop sets `color_theme = "asura"`.
[templates.btop]
input_path = "~/.config/asura/shell/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/asura.theme"

# qt6ct's color_scheme_path must name this file.
[templates.qt6ct]
input_path = "~/.config/asura/shell/matugen/templates/qt6ct-colors.conf"
output_path = "~/.config/qt6ct/colors/asura.conf"
