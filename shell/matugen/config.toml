[config]

# The blocks `zenith theme render -c` fills from the palette the daemon hands it.
# colors.json, the shell's own palette, is not a block: the daemon writes it.
# These always render; apps.toml renders only while "Theme apps" is on.
#
# input_path is the materialised overlay (~/.config/zenith/shell/matugen/...), so a
# user edit wins; before `zenith materialize` has run, the packaged copy under
# /usr/share/zenith is read instead. Only apps Zenith ships have a block here.

# The terminal. The file lives in Zenith's own directory and apps/ghostty/config
# includes it with `config-file = colors`.
[templates.ghostty]
input_path = "~/.config/zenith/shell/matugen/templates/ghostty.conf"
output_path = "~/.config/zenith/apps/ghostty/colors"

# apps/btop sets `color_theme = "zenith"`.
[templates.btop]
input_path = "~/.config/zenith/shell/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/zenith.theme"

# qt6ct's color_scheme_path must name this file.
[templates.qt6ct]
input_path = "~/.config/zenith/shell/matugen/templates/qt6ct-colors.conf"
output_path = "~/.config/qt6ct/colors/zenith.conf"
