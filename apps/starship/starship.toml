# Adapted from Ryoku's starship.toml (GPL-3.0).
add_newline = false
palette = "zenith"

format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:ink_faint'

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[λ](bold fg:green)"
error_symbol = "[λ](bold fg:red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "fg:ink_dim"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " [](bold fg:mauve)[$symbol $branch(:$remote_branch)](bg:mauve fg:surface bold)[](bold fg:mauve)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[󰣇](bg:ink_dim bold fg:ink)[](bold fg:ink_dim)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:ink_dim fg:ink"
style_root = "red bold"
format = "[](bold fg:ink_dim)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:blue fg:surface bold"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:blue)[󰉋 $path]($style)[](bold fg:blue) '

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:peach)[󰪢 $duration](bold bg:peach fg:surface)[](bold fg:peach) '

# Monochrome Zenith terminal palette for starship prompt badges
[palettes.zenith]
ink = "#F2F2F2"
ink_dim = "#CCCCCC"
ink_faint = "#A1A1A1"
surface = "#242424"
blue = "#CCCCCC"
sapphire = "#A1A1A1"
mauve = "#F2F2F2"
green = "#CCCCCC"
peach = "#F5A524"
red = "#E5484D"
teal = "#A1A1A1"
yellow = "#F5A524"
error = "#E5484D"

