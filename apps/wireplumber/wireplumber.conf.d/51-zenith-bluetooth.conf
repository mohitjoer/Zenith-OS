# Adapted from Ryoku's apps/wireplumber/wireplumber.conf.d/51-ryoku-bluetooth.conf (GPL-3.0).
# Zenith Bluetooth audio: mSBC wideband speech for calls (16 kHz instead of the
# telephone-muffled 8 kHz CVSD; classic Bluetooth cannot do hi-fi output and a
# mic at once, so this is the best the headset profile allows), and hi-fi A2DP
# codecs preferred over plain SBC for music.
#
# Codec order note, because it looks wrong and is not: sbc_xq outranks aac on
# purpose. LDAC and aptX still win when a device offers them, so nothing good is
# given up. The interesting rung is the one below: a device that offers neither
# (every Samsung Galaxy Bud, among others) used to land on AAC, and on Linux that
# is the weak choice. PipeWire's AAC typically tops out around 352 kbps while
# SBC-XQ sustains over 500, and Samsung's own AAC is poorly regarded. That single
# ordering is why "Bluetooth sounds terrible" was a brand-shaped complaint: only
# devices without LDAC or aptX ever reached the AAC rung.
#
# bluez5.codecs is a MONITOR property, so this order is global and cannot be
# expressed per device. Devices whose AAC really is better (Apple's, typically)
# need a per-device codec choice, which WirePlumber does not persist on its own.
monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.codecs = [ ldac aptx_hd aptx sbc_xq aac sbc ]
  bluez5.hfphsp-backend = "native"
}

# When an app opens a microphone, switch to the headset (HFP) profile so the
# mic actually works, then fall back to hi-fi A2DP once it closes. Classic
# Bluetooth cannot carry stereo playback and a mic at the same time, and a mic
# that just works in calls is what users expect; mSBC above keeps that profile
# wideband rather than telephone-muffled.
#
# The cost is real and worth naming: while any app holds a mic open, playback on
# that device is mono 16 kHz. A browser tab or a chat app that grabs the mic and
# never lets go therefore sounds broken for as long as it holds it. That trade is
# made here in favour of a mic that works; a device that should stay on A2DP at
# the cost of its mic needs its own rule.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}
