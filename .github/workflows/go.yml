# Go control tools.
#
# There is no Go in this repository yet. The `ken`, `ken-shell` and `ken-hub`
# tools are the second milestone, and this workflow is written now so that the
# first Go commit is covered by CI rather than covered by a later retro-fit.
#
# It is built to be honest about that. It does not pretend there is code, and it
# does not pass vacuously either: it skips, visibly, and it says why.

name: go

on:
  # Path filter first. A commit that touches no Go file cannot break Go, so
  # paying for the toolchain on it is waste. `go.mod` is included because a
  # dependency change is a Go change.
  push:
    branches: [main, dev-unstable]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [main, dev-unstable]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go.yml"
  workflow_dispatch:

# Read-only: the workflow compiles and tests, it never publishes anything.
permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Is there a module yet?
  # --------------------------------------------------------------------------
  # This runs on its own so the answer is a fact rather than a guess, and so the
  # skip is reported as a named job instead of a mysterious absence. A Go file
  # can be added to this repository without a `go.mod` — an early commit will
  # do exactly that — and a workflow that assumes a module would fail with a
  # confusing `go: cannot find main module` rather than a clear skip.
  detect:
    name: detect module
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      has-module: ${{ steps.check.outputs.has-module }}
    steps:
      - uses: actions/checkout@v7

      - name: Look for go.mod
        id: check
        run: |
          if [ -f go.mod ]; then
            echo "has-module=true" >> "$GITHUB_OUTPUT"
            echo "go.mod found; running the Go checks."
          else
            echo "has-module=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No go.mod in this tree. Ken has no Go module yet, so the" \
                 "gofmt, vet and test steps are skipped rather than reported as passing."
          fi

  # --------------------------------------------------------------------------
  # The checks themselves.
  # --------------------------------------------------------------------------
  go:
    name: fmt vet test
    # The skip lives here, not in the steps. A step that prints "nothing to do"
    # reports green, and a green job that checked nothing is worse than no job:
    # it is a check that can never fail and so never has to be looked at again.
    needs: detect
    if: needs.detect.outputs.has-module == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The Go version comes from go.mod rather than a literal here, so the
      # module and CI cannot drift apart: one place declares it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Caching is keyed on go.sum, so the cache is invalidated exactly when
          # the dependency set changes and never for a source-only commit.
          cache-dependency-path: go.sum

      # These are the same three commands agents/agents.md lists under
      # "Verification commands", run in the order a reviewer would run them.

      # gofmt -l prints the name of every file it would reformat and exits 0
      # either way, so the exit status is useless here and the output is the
      # signal. Only tracked files are considered, so a vendored dependency
      # cannot fail a commit that did not touch it.
      - name: gofmt
        run: |
          go_files="$(git ls-files '*.go')"
          if [ -z "$go_files" ]; then
            echo "::notice::A go.mod exists but there are no tracked .go files; nothing to format."
            exit 0
          fi

          # The unquoted expansion is deliberate. git ls-files emits one path per
          # line and gofmt takes them as separate arguments; quoting it would
          # hand gofmt a single filename containing newlines.
          # shellcheck disable=SC2086
          unformatted="$(gofmt -l $go_files)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean. Run 'gofmt -w' on them:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
          echo "gofmt clean."

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...