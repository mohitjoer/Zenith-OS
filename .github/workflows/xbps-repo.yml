name: xbps-repo

on:
  push:
    branches: [main, dev-unstable]
    paths:
      - 'packaging/xbps/**'
      - 'desktop/**'
      - 'session/**'
      - 'system/**'
  pull_request:
    branches: [main, dev-unstable]
    paths:
      - 'packaging/xbps/**'
      - 'desktop/**'
      - 'session/**'
      - 'system/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xbps-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: XBPS — package pipeline (xbps-src)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Zenith XBPS packages in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-linux:latest-full-x86_64 \
            /workspace/packaging/xbps/build-repo.sh /workspace/build/xbps-repo

      - name: Upload XBPS repository artifact
        uses: actions/upload-artifact@v6
        with:
          name: zenith-xbps-repo
          path: build/xbps-repo/
          if-no-files-found: warn
          retention-days: 7
