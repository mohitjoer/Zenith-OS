name: xbps-repo

on:
  push:
    branches: [main, dev-unstable]
    paths:
      - 'packaging/xbps/**'
      - 'desktop/**'
      - 'session/**'
      - 'system/**'
  pull_request:
    branches: [main, dev-unstable]
    paths:
      - 'packaging/xbps/**'
      - 'desktop/**'
      - 'session/**'
      - 'system/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xbps-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: XBPS — package pipeline (xbps-src)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Zenith XBPS packages in Void container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-linux:latest-full-x86_64 \
            sh -eu -c '
              # Update XBPS package manager
              xbps-install -Syu -y xbps
              xbps-install -yu -y
              xbps-install -y git curl tar xz ca-certificates make gcc go

              # Clone void-packages
              git clone --depth 1 https://github.com/void-linux/void-packages.git /tmp/void-packages
              cd /tmp/void-packages

              # Enable container breakout & bootstrap xbps-src
              echo "XBPS_ALLOW_CHROOT_BREAKOUT=yes" >> etc/conf
              ./xbps-src binary-bootstrap

              # Stage custom Zenith XBPS templates
              for pkgdir in /workspace/packaging/xbps/*; do
                [ -d "$pkgdir" ] || continue
                pkgname=$(basename "$pkgdir")
                echo "Staging template for $pkgname..."
                cp -r "$pkgdir" "srcpkgs/$pkgname"
              done

              # Build zenith control plane package
              ./xbps-src pkg zenith

              # Index repository
              mkdir -p /workspace/build/xbps-repo
              cp -r hostdir/binpkgs/* /workspace/build/xbps-repo/ 2>/dev/null || true
              cd /workspace/build/xbps-repo
              xbps-rindex -a *.xbps 2>/dev/null || true
              ls -la
            '

      - name: Upload XBPS repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-xbps-repo
          path: build/xbps-repo/
          if-no-files-found: warn
          retention-days: 7
