name: xbps-repo

on:
  push:
    branches: [main, dev-unstable]
    paths:
      - 'packaging/xbps/**'
      - 'desktop/**'
      - 'session/**'
      - 'system/**'
  pull_request:
    branches: [main, dev-unstable]
    paths:
      - 'packaging/xbps/**'
      - 'desktop/**'
      - 'session/**'
      - 'system/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xbps-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: XBPS — package pipeline (xbps-src)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-linux:latest-full-x86_64
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Void container system
        run: |
          xbps-install -Syu -y xbps
          xbps-install -yu -y
          xbps-install -y git curl tar xz ca-certificates make gcc go

      - name: Clone void-packages and bootstrap xbps-src
        run: |
          git clone --depth 1 https://github.com/void-linux/void-packages.git /tmp/void-packages
          cd /tmp/void-packages
          # Allow running xbps-src inside container
          echo "XBPS_ALLOW_CHROOT_BREAKOUT=yes" >> etc/conf
          ./xbps-src binary-bootstrap

      - name: Stage custom Zenith XBPS templates
        run: |
          for pkgdir in packaging/xbps/*; do
            [ -d "$pkgdir" ] || continue
            pkgname=$(basename "$pkgdir")
            echo "Staging template for $pkgname..."
            cp -r "$pkgdir" "/tmp/void-packages/srcpkgs/$pkgname"
          done

      - name: Build Zenith XBPS packages
        run: |
          cd /tmp/void-packages
          # Build zenith control plane package
          ./xbps-src pkg zenith

      - name: Index repository (xbps-rindex)
        run: |
          cd /tmp/void-packages
          mkdir -p "$RUNNER_TEMP/zenith-xbps-repo"
          cp -r hostdir/binpkgs/* "$RUNNER_TEMP/zenith-xbps-repo/" 2>/dev/null || true
          cd "$RUNNER_TEMP/zenith-xbps-repo"
          xbps-rindex -a *.xbps 2>/dev/null || true
          ls -la

      - name: Upload XBPS repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-xbps-repo
          path: ${{ runner.temp }}/zenith-xbps-repo/
          if-no-files-found: warn
          retention-days: 7
