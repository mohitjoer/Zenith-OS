# Operating-system CI.
#
# Everything gated here is an artefact of the distribution: two Go modules, three
# shell suites, the .deb and its repository, the base-layer manifest, and the
# checked-in branding assets. Documentation is not tested. It is reviewed, and a
# gate that lints prose is a gate whose failures people learn to ignore.
#
# Jobs split by what they cost. `unit-*` is offline and finishes in seconds.
# `package` builds the distribution, signs a repository and resolves the base
# layer against the real Ubuntu archive; it needs `unit` first, so a gofmt slip
# never costs an 80 MB package-index download.

name: ci

on:
  push:
    branches: [main, dev-unstable]
  pull_request:
    branches: [main, dev-unstable]
  workflow_dispatch:

# Read-only. This workflow compiles, packages and verifies. It never publishes,
# never pushes, and needs no secret: the repository signing key is generated per
# run by mkrepo.sh rather than read from the environment, so there is nothing
# here worth stealing and nothing that could leak a key.
permissions:
  contents: read

# Superseded runs are cancelled rather than left to finish. That matters more
# than usual here: the package job's dominant cost is network, and five queued
# runs each pulling the universe index is waste nobody asked for.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # PART 1: Go modules — two independent modules, tested separately
  # ==========================================================================
  go-hardware:
    name: Go — system/hardware module
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: system/hardware/go.mod
          cache-dependency-path: system/hardware/go.mod
      - name: gofmt, vet and test
        working-directory: system/hardware
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"; printf '%s\n' "$unformatted"; exit 1
          fi
          echo "gofmt clean."
          go vet ./...
          go test ./... -v

  go-desktop:
    name: Go — desktop module
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            system/hardware/go.mod
            desktop/go.mod
      - name: gofmt, vet and test
        working-directory: desktop
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"; printf '%s\n' "$unformatted"; exit 1
          fi
          echo "gofmt clean."
          go vet ./...
          go test ./... -v

  # ==========================================================================
  # PART 2: Go module version agreement
  # ==========================================================================
  go-version-check:
    name: Go — module version agreement
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Both modules declare the same Go version
        run: |
          declared() { sed -n 's/^go[[:space:]][[:space:]]*\([0-9][0-9.]*\).*/\1/p' "$1"; }
          hw="$(declared system/hardware/go.mod)"
          dt="$(declared desktop/go.mod)"
          if [ -z "$hw" ] || [ "$hw" != "$dt" ]; then
            echo "::error::Modules disagree: hardware='${hw:-none}', desktop='${dt:-none}'"; exit 1
          fi
          echo "both modules declare go ${hw}"

  # ==========================================================================
  # PART 3: CLI smoke test on a machine with no desktop tools
  # ==========================================================================
  cli-smoke:
    name: CLI — absent-tool paths
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            system/hardware/go.mod
            desktop/go.mod
      - name: Build and smoke-test zenith
        working-directory: desktop
        run: |
          go build -o "$RUNNER_TEMP/zenith" ./cmd/zenith
          for command in state windows; do
            if ! output="$("$RUNNER_TEMP/zenith" "$command")"; then
              echo "::error::zenith $command exited non-zero"; exit 1
            fi
            if ! printf '%s' "$output" | python3 -c 'import json,sys; json.load(sys.stdin)'; then
              echo "::error::zenith $command did not emit valid JSON"; exit 1
            fi
            echo "zenith $command ok"
          done

  # ==========================================================================
  # PART 4: Session & greeter shell tests
  # ==========================================================================
  session-tests:
    name: Session — entry point & greeter
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: session/session_test.sh
        run: sh session/session_test.sh
      - name: session/greeter_test.sh
        run: sh session/greeter_test.sh

  # ==========================================================================
  # PART 5: Shell QML tests
  # ==========================================================================
  shell-tests:
    name: Shell — QML load & contract
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shell/shell_test.sh
        run: sh shell/shell_test.sh
      - name: Branding assets
        run: |
          python3 - <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          SVG = "{http://www.w3.org/2000/svg}"
          LIGHT = Path("public/zenith-logo.svg")
          DARK = Path("public/zenith-logo-on-dark.svg")
          problems = []
          def parse(path):
            try:
              root = ET.parse(path).getroot()
            except ET.ParseError as exc:
              problems.append(f"{path}: not well-formed XML: {exc}"); return None
            if root.tag != SVG + "svg":
              problems.append(f"{path}: root is <{root.tag}>, expected <svg>"); return None
            for attr in ("viewBox", "width", "height"):
              if attr not in root.attrib: problems.append(f"{path}: <svg> has no {attr}")
            return root
          light = parse(LIGHT); dark = parse(DARK)
          nonfinite = re.compile(r"\b(?:nan|NaN|NAN|inf|Inf|INF|-inf|-Inf)\b")
          for path in (LIGHT, DARK):
            hits = nonfinite.findall(path.read_text(encoding="utf-8"))
            if hits: problems.append(f"{path}: non-finite number(s) {sorted(set(hits))}")
          if light is not None and dark is not None:
            lp = light.findall(f".//{SVG}path"); dp = dark.findall(f".//{SVG}path")
            if not lp: problems.append(f"{LIGHT}: no <path> elements")
            elif len(lp) != len(dp): problems.append(f"path count differs: {len(lp)} vs {len(dp)}")
            else:
              for i, (a, b) in enumerate(zip(lp, dp)):
                if a.attrib.get("d") != b.attrib.get("d"): problems.append(f"path[{i}]: geometry differs")
                for key in ("fill-rule", "clip-rule", "transform", "id"):
                  if a.attrib.get(key) != b.attrib.get(key): problems.append(f"path[{i}]: {key} differs")
            def without_fill(root):
              out = []
              for node in root.iter():
                attrs = dict(node.attrib); attrs.pop("fill", None)
                out.append((node.tag, tuple(sorted(attrs.items()))))
              return out
            if without_fill(light) != without_fill(dark): problems.append("the two logos differ by more than fill colour")
            lf = {p.attrib.get("fill") for p in lp}; df = {p.attrib.get("fill") for p in dp}
            if lf == df: problems.append(f"both logos fill {sorted(x for x in lf if x)}; the dark variant must differ")
          if problems:
            print(f"{len(problems)} problem(s) with the branding SVGs:", file=sys.stderr)
            for p in problems: print(f"  {p}", file=sys.stderr)
            sys.exit(1)
          print("branding SVGs OK")
          PY

  # ==========================================================================
  # PART 6: Release scripts syntax check
  # ==========================================================================
  release-scripts:
    name: Release — script syntax
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax check — release scripts
        run: |
          for f in release/*.sh release/build.d/*.build release/deps.d/*.deps session/*.sh session/**/*.sh installation/*.sh system/helpers/**/*.sh tests/**/*.sh; do
            [ -f "$f" ] || continue
            sh -n "$f" 2>/dev/null || echo "::warning::syntax issue in $f"
          done
          echo "shell syntax check done"
      - name: ISO builder test
        run: |
          sh installation/build-iso_test.sh
          sh installation/build-iso-void_test.sh

  # ==========================================================================
  # PART 7: Contract tests
  # ==========================================================================
  contract-tests:
    name: Contract — full suite
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.mod
            desktop/go.sum
            system/hardware/go.mod
            system/hardware/go.sum
      - name: Contract test suite
        run: sh tests/contract/run.sh

  # ==========================================================================
  # PART 8: Package build & boundary
  # ==========================================================================
  package:
    name: Package — deb, boundary, repository, manifest
    needs: [go-hardware, go-desktop, go-version-check]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: system/hardware/go.mod
          cache-dependency-path: |
            system/hardware/go.mod
            desktop/go.mod
      - name: PyYAML for the manifest verifier
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi
          python3 -c 'import yaml; print("PyYAML OK")'
      - name: Build the .deb
        run: sh release/build-debs.sh "$RUNNER_TEMP/debs"
      - name: Every installed path is inside the boundary
        run: |
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"; mkdir -p "$stage"
          dpkg-deb -x $RUNNER_TEMP/debs/*.deb "$stage"
          sh release/check-boundary.sh "$stage" zenith
      - name: release/release_test.sh
        run: sh release/release_test.sh
      - name: release/doctor_test.sh
        run: sh release/doctor_test.sh "$RUNNER_TEMP/debs"

  # ==========================================================================
  # PART 9: M2 integration test (stock base layer)
  # ==========================================================================
  m2:
    name: M2 — update, user edit, rollback
    needs: package
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    steps:
      - uses: actions/checkout@v5
      - name: The tools the stock image does not carry
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends apt-utils ca-certificates dpkg-dev gnupg tar
      - uses: actions/setup-go@v6
        with:
          go-version-file: system/hardware/go.mod
          cache-dependency-path: |
            system/hardware/go.mod
            desktop/go.mod
      - name: zenith update, a user edit, and a rollback — for real
        run: sh release/update_test.sh
        env:
          ZENITH_M2_ALLOW_INSTALL: "1"

  # ==========================================================================
  # PART 10: Void Linux Live ISO build
  # ==========================================================================
  iso:
    name: ISO — build Zenith OS (Void Linux)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: system/hardware/go.mod
          cache-dependency-path: |
            system/hardware/go.mod
            desktop/go.mod
      - name: Install ISO build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin \
            dosfstools mtools python3-yaml curl git tar xz-utils
      - name: Validate Void ISO builder
        run: sh installation/build-iso-void_test.sh
      - name: Build Zenith OS Void ISO
        run: sudo env "PATH=$PATH" installation/build-iso-void.sh "$RUNNER_TEMP/zenith-void-iso"
      - name: Verify ISO output
        run: |
          set -eu
          sudo chmod -R a+rwX "$RUNNER_TEMP/zenith-void-iso"
          iso="$(find "$RUNNER_TEMP/zenith-void-iso" -type f \( -name '*.iso' -o -name '*.hybrid.iso' \) -print -quit)"
          if [ -z "$iso" ]; then
            echo "::error::void-mklive completed without producing an ISO"
            ls -laR "$RUNNER_TEMP/zenith-void-iso"
            exit 1
          fi
          test -s "$iso"
          echo "ISO: $iso ($(du -h "$iso" | cut -f1))"
          sha256sum "$iso" | tee "$iso.sha256"
      - name: Verify Live rootfs shared libraries and binary integrity
        run: |
          set -eu
          MNT="$RUNNER_TEMP/iso-mount"
          SQUASH_MNT="$RUNNER_TEMP/squash-mount"
          ROOTFS_MNT="$RUNNER_TEMP/rootfs-mount"
          mkdir -p "$MNT" "$SQUASH_MNT" "$ROOTFS_MNT"
          iso="$(find "$RUNNER_TEMP/zenith-void-iso" -type f \( -name '*.iso' -o -name '*.hybrid.iso' \) -print -quit)"
          sudo mount -o loop,ro "$iso" "$MNT"
          sudo mount -o loop,ro "$MNT/LiveOS/squashfs.img" "$SQUASH_MNT"

          cleanup() {
            if [ -d "$ROOTFS_MNT" ] && mountpoint -q "$ROOTFS_MNT"; then
              sudo umount "$ROOTFS_MNT" || true
            fi
            if [ -d "$SQUASH_MNT" ] && mountpoint -q "$SQUASH_MNT"; then
              sudo umount "$SQUASH_MNT" || true
            fi
            if [ -d "$MNT" ] && mountpoint -q "$MNT"; then
              sudo umount "$MNT" || true
            fi
          }
          trap cleanup EXIT

          TARGET_ROOT="$SQUASH_MNT"
          if [ -f "$SQUASH_MNT/LiveOS/rootfs.img" ]; then
            sudo mount -o loop,ro "$SQUASH_MNT/LiveOS/rootfs.img" "$ROOTFS_MNT"
            TARGET_ROOT="$ROOTFS_MNT"
          fi

          echo "== Checking Hyprland, QuickShell, and Zenith binaries in rootfs ($TARGET_ROOT) =="
          failed=0
          check_binary() {
            bin="$1"
            echo "Checking $bin..."
            if [ ! -f "$TARGET_ROOT$bin" ]; then
              echo "::error::Binary $bin is missing from Live rootfs!"
              failed=$((failed + 1))
              return
            fi
            ldso="$(find "$TARGET_ROOT/usr/lib"* "$TARGET_ROOT/lib"* -name 'ld-linux*.so*' 2>/dev/null | head -n 1 || true)"
            if [ -n "$ldso" ] && [ -x "$ldso" ]; then
              missing=$(LD_LIBRARY_PATH="$TARGET_ROOT/usr/lib:$TARGET_ROOT/lib" "$ldso" --list "$TARGET_ROOT$bin" 2>&1 | grep "not found" || true)
            else
              missing=$(LD_LIBRARY_PATH="$TARGET_ROOT/usr/lib:$TARGET_ROOT/lib" ldd "$TARGET_ROOT$bin" 2>&1 | grep "not found" || true)
            fi
            if [ -n "$missing" ]; then
              echo "::error::Binary $bin has missing shared libraries:"
              echo "$missing"
              failed=$((failed + 1))
            else
              echo "  OK: all shared libraries resolved for $bin"
            fi
          }

          check_binary "/usr/bin/Hyprland"
          check_binary "/usr/bin/zenith"
          check_binary "/usr/bin/zenith-shell"
          check_binary "/usr/bin/zenith-sysd"
          if [ -f "$TARGET_ROOT/usr/bin/quickshell" ]; then
            check_binary "/usr/bin/quickshell"
          fi

          # Verify Plymouth label plugin
          if [ ! -f "$TARGET_ROOT/usr/lib/plymouth/label.so" ]; then
            echo "::error::Plymouth label.so is missing from /usr/lib/plymouth!"
            failed=$((failed + 1))
          else
            echo "  OK: /usr/lib/plymouth/label.so present"
          fi

          # Verify no foreign libsystemd requirement in libseat
          if [ -f "$TARGET_ROOT/usr/lib/libseat.so.1" ]; then
            if readelf -d "$TARGET_ROOT/usr/lib/libseat.so.1" 2>/dev/null | grep -q "libsystemd.so.0"; then
              echo "::error::/usr/lib/libseat.so.1 is dynamically linked against libsystemd.so.0!"
              failed=$((failed + 1))
            else
              echo "  OK: /usr/lib/libseat.so.1 is native (no libsystemd requirement)"
            fi
          fi

          cleanup
          trap - EXIT

          if [ "$failed" -gt 0 ]; then
            echo "Rootfs library validation failed with $failed error(s)!"
            exit 1
          fi
          echo "Rootfs library and binary validation passed cleanly!"
      - name: Test ISO headless boot in QEMU
        timeout-minutes: 6
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 netpbm
          iso="$(find "$RUNNER_TEMP/zenith-void-iso" -type f \( -name '*.iso' -o -name '*.hybrid.iso' \) -print -quit)"

          mkdir -p "$RUNNER_TEMP/qemu-test"
          SERIAL_LOG="$RUNNER_TEMP/qemu-test/serial.log"
          QMP_SOCK="$RUNNER_TEMP/qemu-test/qmp.sock"
          SCREENSHOT="$RUNNER_TEMP/qemu-test/boot-screen.ppm"
          SCREENSHOT_PNG="$RUNNER_TEMP/qemu-test/boot-screen.png"

          KVM_FLAG=""
          if [ -w /dev/kvm ]; then
            KVM_FLAG="-enable-kvm -cpu host"
          else
            KVM_FLAG="-cpu max"
          fi

          echo "Starting QEMU boot test ($KVM_FLAG)..."
          qemu-system-x86_64 \
            $KVM_FLAG \
            -m 2048 \
            -smp 2 \
            -cdrom "$iso" \
            -boot d \
            -vga std \
            -display none \
            -serial file:"$SERIAL_LOG" \
            -qmp unix:"$QMP_SOCK",server,nowait \
            -daemonize \
            -pidfile "$RUNNER_TEMP/qemu-test/qemu.pid"

          echo "Waiting for boot sequence (~60-90s in software emulation)..."
          for i in $(seq 1 60); do
            sleep 2
            if [ -f "$SERIAL_LOG" ] && grep -qa "zenith-os login:" "$SERIAL_LOG"; then
              echo "Detected TTY auto-login prompt in serial log at ~$((i * 2))s!"
              break
            fi
          done


          # Capture QEMU virtual screen via QMP screendump
          python3 -c '
            import socket, json, time, sys
            sock_path = sys.argv[1]
            ppm_path = sys.argv[2]
            time.sleep(1)
            try:
                s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                s.connect(sock_path)
                s.recv(1024)
                s.sendall(b"{\"execute\": \"qmp_capabilities\"}\n")
                s.recv(1024)
                cmd = json.dumps({"execute": "screendump", "arguments": {"filename": ppm_path}}) + "\n"
                s.sendall(cmd.encode())
                s.recv(1024)
                s.close()
                print("Captured screenshot to " + ppm_path)
            except Exception as e:
                print("Warning: screenshot capture failed: " + str(e))
            ' "$QMP_SOCK" "$SCREENSHOT" || true



          if [ -f "$SCREENSHOT" ] && command -v pnmtopng >/dev/null 2>&1; then
            pnmtopng "$SCREENSHOT" > "$SCREENSHOT_PNG" 2>/dev/null || true
          fi

          # Stop QEMU
          if [ -f "$RUNNER_TEMP/qemu-test/qemu.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/qemu-test/qemu.pid")" 2>/dev/null || true
          fi

          echo "== Serial Console Output =="
          head -n 40 "$SERIAL_LOG" 2>/dev/null || true
          echo "..."
          tail -n 40 "$SERIAL_LOG" 2>/dev/null || true
          echo "==========================="
      - name: Upload QEMU Boot Artifacts (Screenshot & Serial Log)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zenith-boot-test-artifacts
          path: |
            ${{ runner.temp }}/qemu-test/serial.log
            ${{ runner.temp }}/qemu-test/boot-screen.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v6
        with:
          name: zenith-os-beta-001
          path: |
            ${{ runner.temp }}/zenith-void-iso/*.iso
            ${{ runner.temp }}/zenith-void-iso/*.iso.sha256
          if-no-files-found: error
          retention-days: 7
