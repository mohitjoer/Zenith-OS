# The store's two trees must never drift.
#
# The standalone asura-store repository (github.com/ASURA-OS/asura-store,
# public) owns the backend and the window: the ISO builder builds the binary
# from it whenever it is available (`ASURA_STORE_SRC`, with the checkout under
# the tree next to this one winning), and `desktop/cmd/asura-store/` and
# `shell/store/` here are its byte-identical copies, with `desktop/catalog/`
# carrying the same catalogue JSON so a desktop-tree build still finds a shop.
#
# This workflow clones the standalone repo, runs its checks against this
# tree's copies, and refuses any byte that drifts. The daily schedule catches
# upstream commits nobody mirrored here yet.

name: store-sync

on:
  push:
    branches: [main, dev-unstable]
    paths:
      - 'desktop/cmd/asura-store/**'
      - 'shell/store/**'
      - 'shell/store.qml'
      - 'desktop/catalog/**'
      - '.github/workflows/store-sync.yml'
  pull_request:
    branches: [main, dev-unstable]
    paths:
      - 'desktop/cmd/asura-store/**'
      - 'shell/store/**'
      - 'shell/store.qml'
      - 'desktop/catalog/**'
      - '.github/workflows/store-sync.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: store-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ASURA-OS
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check out the standalone store repository
        uses: actions/checkout@v5
        with:
          repository: ASURA-OS/asura-store
          ref: main
          path: store-upstream
          fetch-depth: 1

      - name: Set up Go at the version this module pins
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The embedded backend passes the standalone repo's checks as-is
        run: |
          cd desktop
          drift="$(gofmt -l cmd/asura-store)"
          if [ -n "$drift" ]; then
            echo "gofmt would change:"
            echo "$drift"
            exit 1
          fi
          go vet ./cmd/asura-store
          go test -count=1 -race ./cmd/asura-store

      - name: The window's JavaScript helpers pass their tests
        run: node --test shell/store/lib/store.test.mjs

      - name: The embedded backend is byte-identical with the standalone repo
        run: diff -r desktop/cmd/asura-store store-upstream/cmd/asura-store

      - name: The window is byte-identical (store.qml, the entry file, resolved below)
        run: |
          # `diff -r` exits 1 on differences — the expected case here, the
          # entry file — and GitHub's shell runs under bash -e, so an
          # assignment like out="$(diff ...)" would abort before comparing.
          # Let the substitution swallow the exit and compare the text; a real
          # failure surfaces as stdout/stderr the comparison cannot match.
          out="$(diff -r shell/store store-upstream/ui; true)"
          expected="Only in store-upstream/ui: store.qml"
          if [ "$out" != "$expected" ]; then
            echo "$out"
            exit 1
          fi
          diff -q shell/store.qml store-upstream/ui/store.qml

      - name: The catalogue is byte-identical
        run: diff -r desktop/catalog store-upstream/catalog
