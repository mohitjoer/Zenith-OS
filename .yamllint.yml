# yamllint configuration for Ken OS.
#
# Matched to the YAML that is actually in this repository rather than to a
# generic profile, and every rule relaxed below carries its reason. The rule
# that does the real work here is not a style rule at all — it is yamllint's
# parser, which fails the run on a syntax error. These files are read by an
# installer, by a kernel-fleet loader, by a GSettings-aware tooling chain and by
# GitHub's issue-form schema, and all of them fail quietly and confusingly on
# malformed YAML.
#
# The tree is linted with `--strict`, so warnings count too. A relaxed rule
# below is therefore a decision, not an escape hatch.

# This file is linted by the same run as everything else — it is YAML too, and
# a config that does not parse is a gate that silently does nothing.

extends: default

rules:
  # ------------------------------------------------------------------------
  # Line length.
  # ------------------------------------------------------------------------
  # The data files are written to 80 columns and stay there: system/packages.yaml
  # has zero lines over 80. The two issue forms are the exception, and they are
  # the reason the ceiling is not 80.
  #
  # A GitHub issue form's `description` is a single string rendered on the
  # issue page. Folding one into a YAML block scalar changes the text GitHub
  # shows, and these descriptions are written as one sentence on purpose. So
  # rather than disable the rule — which would also stop the data files being
  # held to 80 — the ceiling is set just above the longest such line in the tree.
  line-length:
    max: 180
    allow-non-breakable-words: true

  # ------------------------------------------------------------------------
  # Trailing newline.
  # ------------------------------------------------------------------------
  # Off, and the reason is worth writing down.
  #
  # Five of the six YAML files in the tree do not end with a newline: both issue
  # forms, system/hardware/tiers.yaml, system/hardware/profiles/example.yaml
  # and system/kernel/fleet.yaml. They were written by a tool that does not
  # append one, and nothing downstream cares.
  #
  # The preferred fix was a five-entry `ignore:` list, which keeps the rule on
  # for every future file. It does not work: yamllint's ignore patterns are
  # globbed, and the list behaves order-dependently — moving
  # system/kernel/fleet.yaml from the first line to the second changes whether
  # it is honoured at all. A gate whose result depends on the order of a config
  # list is not a gate, so the rule is switched off deliberately and verifiably
  # instead. Turn it back on, one file at a time, as the newlines are added.
  new-line-at-end-of-file: disable

  # ------------------------------------------------------------------------
  # Document start marker.
  # ------------------------------------------------------------------------
  # Off, and deliberately so.
  #
  # Every YAML file in this repository is a single document read whole by one
  # consumer. system/packages.yaml records the reason in its own header: a real
  # `---` between the manifest groups would turn the file into a multi-document
  # stream, and a loader using a single-document parser would silently see the
  # first group and nothing else. A start marker is the same hazard, so it is
  # not wanted here.
  document-start: disable

  # ------------------------------------------------------------------------
  # Comments.
  # ------------------------------------------------------------------------
  # system/kernel/fleet.yaml ends with a deliberately commented-out key:
  #
  #   # open:
  #   #   default_for_unknown: hwe | generic
  #
  # The second line is indented under the first because that is what the
  # uncommented block would look like, and keeping it that way makes the open
  # decision readable as the YAML it will become. yamllint reads the indent as
  # a mistake. It is not one.
  comments-indentation: disable

  # An inline comment must stand at least two spaces clear of the value it
  # annotates — they are aligned in columns across a block:
  #
  #   - universe        # compositors, portals, most of this file
  #   - multiverse      # a handful of packages with no free reimplementation
  comments:
    min-spaces-from-content: 2

  # ------------------------------------------------------------------------
  # Truthy values.
  # ------------------------------------------------------------------------
  # `on` is not a boolean here.
  #
  # YAML 1.1 reads the bare word `on` as true, so a workflow file written as
  # `on:` trips yamllint's key check even though GitHub's schema reads that key
  # as the string "on". The key check is switched off rather than the key
  # quoted, because quoting the trigger key reads as though something is wrong
  # with it. Value checking stays on, so `enabled: yes` is still an error.
  truthy:
    allowed-values: ["true", "false", "on"]
    check-keys: false

  # ------------------------------------------------------------------------
  # Indentation.
  # ------------------------------------------------------------------------
  # Two spaces, and sequence entries indented under the key that owns them:
  #
  #   essential:
  #     packages:
  #       - ubuntu-minimal
  #
  # The manifest, the tier database, the kernel fleet and the workflow files
  # all use this shape, and keeping the sequence indent means a reader can tell
  # which key a list belongs to at a glance.
  indentation:
    spaces: consistent
    indent-sequences: consistent
    check-multi-line-strings: false