# Turnstile configuration for Zenith OS
# Turnstile manages per-user sessions and runs a user-level service manager under runit.

[General]
# Backend service manager to spawn per-user
backend = runit

# Automatically manage and mount /run/user/$UID with correct permissions
manage_rundir = yes

# Automatically export DBUS_SESSION_BUS_ADDRESS into the user environment
export_dbus_address = yes
