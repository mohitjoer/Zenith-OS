# Border colours are the design system's greys. The shell recolours them live
# through the decoration.borderColors action; a reload returns to these.
general {
    gaps_in = 12
    gaps_out = 18
    border_size = 2
    layout = dwindle
    resize_on_border = true
    # only windows carrying the `immediate` rule (games) actually tear
    allow_tearing = true
    col.active_border = rgb(d4d4d4)
    col.inactive_border = rgb(3a3a3a)
}

decoration {
    rounding = 0
    rounding_power = 4
    active_opacity = 1
    inactive_opacity = 0.94
    shadow {
        enabled = true
        range = 45
        render_power = 4
        color = rgba(0a0807d1)
    }
    blur {
        enabled = true
        size = 4
        passes = 1
        vibrancy = 0.17
        noise = 0.01
        new_optimizations = true
    }
}

# Settings > Performance and the shell's Power Saver switch compositor blur and
# shadows off through JSON files hyprlang cannot read. This script reads them
# and applies the result with `hyprctl keyword`. `exec` rather than `exec-once`,
# so the reload that applies a changed switch runs it again. It changes nothing
# when every switch is off.
exec = zenith-perf-apply

# The print filter (shaders/) is named in shell.json. The shell applies it live
# itself; a reload drops it, so this puts it back. `exec` rather than exec-once.
exec = n=$(grep -oE '"screenShader" *: *"[a-z]+"' "$HOME/.config/zenith/shell.json" 2>/dev/null | grep -oE '[a-z]+"$' | tr -d '"'); [ -n "$n" ] && hyprctl keyword decoration:screen_shader "/usr/share/zenith/hyprland/shaders/$n.glsl" >/dev/null
