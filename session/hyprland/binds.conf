# --- Tools -----------------------------------------------------------------
# Print and Super+Shift+S open the screenshot editor on a region, or on the
# window under the pointer; Shift+Print starts on a whole monitor. Both the
# print key and its XF86 twin are bound: keyboards differ on which the Fn row
# emits.
bind = ,Print, exec, zenith-shot
bind = ,XF86Print, exec, zenith-shot
bind = SUPER SHIFT, S, exec, zenith-shot
bind = SHIFT, Print, exec, env ZENITH_SHOT_MODE=monitor zenith-shot
bind = SUPER SHIFT, C, exec, zenith-cmd-color-picker



# --- Ryoku features ported -------------------------------------------------
# On-screen keyboard (Super+K is cheatsheet in Zenith; use Super+Alt+K)
bind = SUPER ALT, K, exec, zenith ipc call zenith toggleSurface onscreen-keyboard

# Widget overlay toggle (Super+G)
bind = SUPER ALT, G, exec, zenith ipc call zenith toggleSurface overlay

# Session menu (Ctrl+Alt+Delete)
bind = CTRL ALT, Delete, exec, zenith-shell session

# Bar toggle (Super+J)
bind = SUPER, J, exec, zenith ipc call zenith toggleSurface barToggle

# Light/dark mode toggle (Ctrl+Super+Shift+D)
bind = CTRL SUPER SHIFT, D, exec, zenith-shell theme toggle

# Restart widgets (Ctrl+Super+R)
bind = CTRL SUPER, R, exec, zenith-shell restart

# Panel family cycle (Ctrl+Super+P)
bind = CTRL SUPER, P, exec, zenith-shell panel cycle

# Region search / Google Lens (Super+Shift+A)
bind = SUPER SHIFT, A, exec, zenith ipc call zenith toggleSurface region-search

# OCR (Super+Shift+X)
bind = SUPER SHIFT, X, exec, zenith ipc call zenith toggleSurface ocr

# Screen translate (Super+Shift+T)
bind = SUPER SHIFT, T, exec, zenith ipc call zenith toggleSurface translate

# Region record (Super+Shift+R)
bind = SUPER SHIFT, R, exec, zenith ipc call zenith toggleSurface region-record

# Fullscreen record (Ctrl+Alt+R)
bind = CTRL ALT, R, exec, zenith ipc call zenith toggleSurface fullscreen-record

# Screenshot to file (Ctrl+Print)
bind = CTRL, Print, exec, zenith-shot --save

# Zoom in/out (Super+Equal/Minus)
bind = SUPER, Equal, exec, hyprctl dispatch zoom 0.3
bind = SUPER, Minus, exec, hyprctl dispatch zoom -0.3

# Split ratio adjust (Super+Semicolon/Apostrophe)
bind = SUPER, Semicolon, exec, hyprctl dispatch layout splitratio -0.1
bind = SUPER, Apostrophe, exec, hyprctl dispatch layout splitratio +0.1

# Float/tile toggle (Super+Alt+Space) - Super+A already does this differently
bind = SUPER ALT, Space, exec, hyprctl dispatch togglefloating

# Force kill window (Super+Shift+Alt+Q)
bind = SUPER CTRL ALT SHIFT, Q, exec, hyprctl kill

# Sleep (Super+Shift+L)
bind = SUPER SHIFT, L, exec, systemctl suspend

# Volume mixer (Ctrl+Super+V)
bind = CTRL SUPER, V, exec, zenith-volume mixer

# Task manager (Ctrl+Shift+Escape)
bind = CTRL SHIFT, Escape, exec, zenith-app taskmanager

# Text editor (Super+X)
bind = SUPER, X, exec, zenith-app editor --text


# Volume mixer (SUPER+CTRL+V)
bind = SUPER CTRL, V, exec, zenith-volume mixer

# Panel family cycle (SUPER+CTRL+P)
bind = SUPER CTRL, P, exec, zenith-shell panel cycle

# Restart widgets (SUPER+CTRL+R)
bind = SUPER CTRL, R, exec, zenith-shell restart

# Theme toggle (SUPER+CTRL+SHIFT+D)
bind = SUPER CTRL SHIFT, D, exec, zenith-shell theme toggle

# Force kill window (SUPER+SHIFT+ALT+Q)

# Sleep (SUPER+SHIFT+L)

# Task manager (CTRL+SHIFT+Escape)

# Text editor (SUPER+X)

# Screenshot to file (CTRL+Print)

# Session menu (CTRL+ALT+Delete)

# Bar toggle (SUPER+J)

# On-screen keyboard (SUPER+ALT+K)

# Float/tile toggle (SUPER+ALT+Space)

# Zoom in/out (SUPER+Equal/Minus)

# Split ratio adjust (SUPER+Semicolon/Apostrophe)

# Region search (SUPER+SHIFT+A) - already added above
# OCR (SUPER+SHIFT+X)

# Translate (SUPER+SHIFT+T)

# Region record (SUPER+SHIFT+R)

# Fullscreen record (CTRL+ALT+R)

# --- Media and volume (locked: they work over the lock screen) ---------------
# zenith-volume honours the volume panel's boost toggle: off caps at 100%, on 150%.
bindel = , XF86AudioRaiseVolume, exec, zenith-volume up
bindel = , XF86AudioLowerVolume, exec, zenith-volume down
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bind = SUPER CTRL ALT SHIFT, A, exec, zenith-restart-audio
bind = SUPER SHIFT, V, exec, zenith-summon zenith-vm flock -n -o /tmp/zenith-vm.lock zenith-vm

# --- Hardware (W18) --------------------------------------------------------
# Brightness goes through zenith-cmd-brightness -> `zenith brightness`, which
# asks systemd-logind to write the value, so no group membership is needed.
bindel = , XF86MonBrightnessUp, exec, zenith-cmd-brightness +5
bindel = , XF86MonBrightnessDown, exec, zenith-cmd-brightness -5
# Keyboard backlight keys, for laptops whose driver reports them as key events
# (the ASUS driver here steps the LED itself and never does).
bindel = , XF86KbdBrightnessUp, exec, zenith brightness up --device kbd
bindel = , XF86KbdBrightnessDown, exec, zenith brightness down --device kbd
# The Fn touchpad key. Hyprland has no read-back for a device's state, so
# zenith-touchpad keeps the intent in the runtime directory.
bindl = , XF86TouchpadToggle, exec, zenith-touchpad toggle
bindl = , XF86TouchpadOn, exec, zenith-touchpad on
bindl = , XF86TouchpadOff, exec, zenith-touchpad off
