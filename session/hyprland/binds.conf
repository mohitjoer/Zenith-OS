# Every key the keyboard has, in one place. session/binds.json is the same
# list written for a person: `zenith doctor` compares the two in both
# directions, so a bind added here needs a line there and the other way round.
# Shell surfaces are called as `zenith ipc call zenith <function> [argument]`;
# `zenith ipc` finds the running shell, so the key works whichever tree runs.
#
# Flags: l = works over the lock screen, e = repeats while held, r = fires on
# key RELEASE, m = mouse. `bindl` is the lock-screen flag and fires on the
# press: a bind/bindl pair opens and closes a switcher in the same instant.
# Anything that must act on release is `bindr`.

# --- Desktop ---------------------------------------------------------------
bind = SUPER, Space, exec, zenith ipc call zenith togglePopover launcher
bind = SUPER, Escape, exec, zenith ipc call zenith togglePopover quick
bind = SUPER, S, exec, zenith ipc call zenith toggleSurface stash
bind = SUPER, V, exec, zenith ipc call zenith toggleSurface clipboard
bind = SUPER, K, exec, zenith ipc call zenith toggleCheatsheet
bind = SUPER, L, exec, zenith-shell lock
bind = SUPER, comma, exec, zenith-shell hub open
bind = SUPER, grave, exec, zenith-shell voice
bind = SUPER, W, exec, zenith-wallpaper wallpaper ui
bind = SUPER SHIFT, W, exec, zenith-wallpaper wallpaper random
bind = SUPER, M, exec, zenith ipc call zenith toggleSurface visualizer
bind = SUPER SHIFT, M, exec, zenith ipc call zenith toggleSurface visualizer-overlay
bind = SUPER ALT, M, exec, zenith ipc call zenith toggleSurface visualizer-place

# Super+Tab is the workspace overview (an expo of live window previews); with
# Alt it steps to the next desktop, inside the overview or opening it there.
bind = SUPER, Tab, exec, zenith ipc call zenith toggleOverview
bind = SUPER ALT, Tab, exec, zenith ipc call zenith overviewDesktop 1

# Alt+Tab is the most-recently-used window switcher: a press moves to the next
# window and focuses it, Shift walks the list the other way, and the card stays
# up 450 ms after the last press or release. The release is `bindr`. A release
# bind needs its modifier still held, hence a pair for Shift; when Alt comes up
# first the card ends itself after the dwell.
bind = ALT, Tab, exec, zenith ipc call zenith advanceSwitcher
bind = ALT SHIFT, Tab, exec, zenith ipc call zenith reverseSwitcher
bindr = ALT, Tab, exec, zenith ipc call zenith closeSwitcher
bindr = ALT SHIFT, Tab, exec, zenith ipc call zenith closeSwitcher

# --- Apps ------------------------------------------------------------------
# Two chords for the terminal: Return is Ryoku's, T is what Zenith always had.
bind = SUPER, T, exec, zenith-app terminal
bind = SUPER, Return, exec, zenith-app terminal
bind = SUPER, E, exec, zenith-app files
bind = SUPER, B, exec, zenith-app browser
bind = SUPER, N, exec, zenith-app editor
bind = SUPER, O, exec, zenith-app notes

# --- Windows ---------------------------------------------------------------
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen, 0
bind = SUPER, D, fullscreen, 1
bind = SUPER, C, centerwindow,
bind = SUPER SHIFT, P, pin,
bind = SUPER, G, togglegroup,
# Float at 1000x660, centred; press again to tile back.
bind = SUPER, A, exec, hyprctl --batch "dispatch togglefloating ; dispatch resizeactive exact 1000 660 ; dispatch centerwindow"
# Resize mode (resize.conf). Entering a submap is silent, hence the toast.
bind = SUPER, R, exec, hyprctl dispatch submap resize && hyprctl notify -1 2200 0 "Resize mode: arrows or hjkl resize. Esc exits"

bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d
bind = SUPER SHIFT, Left, movewindow, l
bind = SUPER SHIFT, Right, movewindow, r
bind = SUPER SHIFT, Up, movewindow, u
bind = SUPER SHIFT, Down, movewindow, d
binde = SUPER CTRL, Left, resizeactive, -40 0
binde = SUPER CTRL, Right, resizeactive, 40 0
binde = SUPER CTRL, Up, resizeactive, 0 -40
binde = SUPER CTRL, Down, resizeactive, 0 40
bind = SUPER, bracketleft, movewindoworgroup, l
bind = SUPER, bracketright, movewindoworgroup, r

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# --- Monitors (the l/r/u/d selector picks the monitor in that direction) ----
bind = SUPER ALT, Left, focusmonitor, l
bind = SUPER ALT, Right, focusmonitor, r
bind = SUPER ALT, Up, focusmonitor, u
bind = SUPER ALT, Down, focusmonitor, d
bind = SUPER ALT SHIFT, Left, movewindow, mon:l
bind = SUPER ALT SHIFT, Right, movewindow, mon:r
bind = SUPER ALT SHIFT, Up, movewindow, mon:u
bind = SUPER ALT SHIFT, Down, movewindow, mon:d
bind = SUPER CTRL ALT, Left, movecurrentworkspacetomonitor, l
bind = SUPER CTRL ALT, Right, movecurrentworkspacetomonitor, r
bind = SUPER CTRL ALT, Up, movecurrentworkspacetomonitor, u
bind = SUPER CTRL ALT, Down, movecurrentworkspacetomonitor, d
bind = SUPER, P, exec, zenith-monitor toggle

# --- Workspaces ------------------------------------------------------------
# Super+N is the Nth workspace of the CURRENT DESKTOP (a desktop is a block of
# 10 workspace ids; see zenith-workspace), so on desktop 2 Super+3 is ws13.
# Super+Alt+N sends the window there and follows, Super+Shift+N sends it
# without following. The number pad does the same, bound twice: on KP_<n> (the
# keysym with NumLock on) and on the navigation keysym the same key sends with
# NumLock off.
bind = SUPER, H, exec, zenith-workspace hide
bind = SUPER ALT, H, exec, zenith-workspace scratch
bind = SUPER, mouse_up, workspace, r-1
bind = SUPER, mouse_down, workspace, r+1
bind = SUPER, Prior, workspace, r-1
bind = SUPER, Next, workspace, r+1
bind = SUPER SHIFT, Prior, movetoworkspace, r-1
bind = SUPER SHIFT, Next, movetoworkspace, r+1

bind = SUPER, 1, exec, zenith-workspace focus 1
bind = SUPER, 2, exec, zenith-workspace focus 2
bind = SUPER, 3, exec, zenith-workspace focus 3
bind = SUPER, 4, exec, zenith-workspace focus 4
