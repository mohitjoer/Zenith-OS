bind = SUPER, 7, exec, zenith-workspace focus 7
bind = SUPER, 8, exec, zenith-workspace focus 8
bind = SUPER, 9, exec, zenith-workspace focus 9
bind = SUPER, 0, exec, zenith-workspace focus 10
bind = SUPER, KP_1, exec, zenith-workspace focus 1
