# --- Tools -----------------------------------------------------------------
# Print and Super+Shift+S open the screenshot editor on a region, or on the
# window under the pointer; Shift+Print starts on a whole monitor. Both the
# print key and its XF86 twin are bound: keyboards differ on which the Fn row
# emits.
bind = ,Print, exec, zenith-shot
bind = ,XF86Print, exec, zenith-shot
bind = SUPER SHIFT, S, exec, zenith-shot
bind = SHIFT, Print, exec, env ZENITH_SHOT_MODE=monitor zenith-shot
bind = SUPER SHIFT, C, exec, zenith-cmd-color-picker

# --- Media and volume (locked: they work over the lock screen) ---------------
# zenith-volume honours the volume panel's boost toggle: off caps at 100%, on 150%.
bindel = , XF86AudioRaiseVolume, exec, zenith-volume up
bindel = , XF86AudioLowerVolume, exec, zenith-volume down
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bind = SUPER SHIFT, A, exec, zenith-restart-audio
bind = SUPER SHIFT, V, exec, zenith-summon zenith-vm flock -n -o /tmp/zenith-vm.lock zenith-vm

# --- Hardware (W18) --------------------------------------------------------
# Brightness goes through zenith-cmd-brightness -> `zenith brightness`, which
# asks systemd-logind to write the value, so no group membership is needed.
bindel = , XF86MonBrightnessUp, exec, zenith-cmd-brightness +5
bindel = , XF86MonBrightnessDown, exec, zenith-cmd-brightness -5
# Keyboard backlight keys, for laptops whose driver reports them as key events
# (the ASUS driver here steps the LED itself and never does).
bindel = , XF86KbdBrightnessUp, exec, zenith brightness up --device kbd
bindel = , XF86KbdBrightnessDown, exec, zenith brightness down --device kbd
# The Fn touchpad key. Hyprland has no read-back for a device's state, so
# zenith-touchpad keeps the intent in the runtime directory.
bindl = , XF86TouchpadToggle, exec, zenith-touchpad toggle
bindl = , XF86TouchpadOn, exec, zenith-touchpad on
bindl = , XF86TouchpadOff, exec, zenith-touchpad off

# Thermal and fan profiles (Fn+F5 on ASUS TUF/ROG and laptops with fan switch keys)
bindl = , XF86Launch4, exec, fan-profile
