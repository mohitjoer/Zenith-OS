# Zenith's idle policy, run by zenith-idle.service.
#
# hypridle cannot read GSettings, so zenith-idle exports the timeouts of
# org.zenith.desktop (idle-dim-seconds, idle-blank-seconds, idle-lock-seconds)
# as the variables below and a stage whose timeout is 0 (never) is left out.
#
# hypridle holds every stage while something inhibits idle, a playing video or
# Keep Awake, because its ignore_*_inhibit keys default to off. Nothing here
# overrides that.

general {
    lock_cmd = zenith-shell lock
    before_sleep_cmd = zenith-shell lock
    after_sleep_cmd = hyprctl dispatch dpms on
    # Delay sleeping until the session reports it is locked, so the machine never
    # suspends with the desktop still showing.
    inhibit_sleep = 3
}

# Dim. The shell draws the scrim (shell/Idle.qml); it watches this file.
# hyprlang if ZENITH_IDLE_DIM
listener {
    timeout = $ZENITH_IDLE_DIM
    on-timeout = echo dim > $XDG_RUNTIME_DIR/zenith-idle
    on-resume = echo awake > $XDG_RUNTIME_DIR/zenith-idle
}
# hyprlang endif

# Lock.
# hyprlang if ZENITH_IDLE_LOCK
listener {
    timeout = $ZENITH_IDLE_LOCK
    on-timeout = zenith-shell lock
}
# hyprlang endif

# Screen off.
# hyprlang if ZENITH_IDLE_BLANK
listener {
    timeout = $ZENITH_IDLE_BLANK
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
# hyprlang endif
