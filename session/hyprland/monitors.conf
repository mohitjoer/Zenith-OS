# The catch-all every output without a rule of its own falls back to: its
# preferred mode, placed to the right of the others, at scale 1. Scale is
# explicit on purpose: Hyprland's own `auto` picks 1.5 for a 15.6 inch 1080p
# panel (143 PPI is over its 140 threshold), which is not what Zenith has
# always shown. Scaling by pixel density is opt-in: `zenith-monitor autoscale on`.
# Per-output rules come from zenith-monitor (monitors-auto.conf, sourced last)
# and from the user's monitors-user.conf.
monitor = , preferred, auto, 1
