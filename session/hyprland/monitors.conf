# The catch-all every output without a rule of its own falls back to: its
# preferred mode, placed to the right of the others, at scale 1. Scale is
# explicit on purpose: Hyprland's own `auto` picks 1.5 for a 15.6 inch 1080p
# panel (143 PPI is over its 140 threshold), which is not what Asura has
# always shown. Scaling by pixel density is opt-in: `asura-monitor autoscale on`.
# Per-output rules come from asura-monitor (monitors-auto.conf, sourced last)
# and from the user's monitors-user.conf.
# Catch-all for outputs without a rule of their own: preferred mode, auto position, scale 1.
monitor = , preferred, auto, 1

# Explicit fallbacks for virtual machine display connectors (VirtualBox, QEMU, VMware)
# Prevents Aquamarine from failing with "Monitor has NO FALLBACK MODES, and an INVALID one was requested: 0x0@60.00Hz"
monitor = VGA-1, 1280x800@60, auto, 1
monitor = Virtual-1, 1280x800@60, auto, 1
monitor = Virtual1, 1280x800@60, auto, 1
monitor = default, 1280x800@60, auto, 1
