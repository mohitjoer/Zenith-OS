# Screenshots. Print and Super+Shift+S open the editor on a region, or on the window
# under the pointer; Shift+Print starts on a whole monitor. Same three chords as the
# reference desktop. Layer namespace of the overlay: zenith-shot.
bind = SUPER SHIFT, S, exec, zenith-shot
bind = , Print, exec, zenith-shot
bind = SHIFT, Print, exec, env ZENITH_SHOT_MODE=monitor zenith-shot

