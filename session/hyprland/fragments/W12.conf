# Screenshots. Print and Super+Shift+S open the editor on a region, or on the window
# under the pointer; Shift+Print starts on a whole monitor. Same three chords as the
# reference desktop. Layer namespace of the overlay: asura-shot.
bind = SUPER SHIFT, S, exec, asura-shot
bind = , Print, exec, asura-shot
bind = SHIFT, Print, exec, env ASURA_SHOT_MODE=monitor asura-shot

