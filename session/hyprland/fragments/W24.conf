# The volume keys go through zenith-volume so the Boost toggle (qsbar.audioBoost
# in shell.json) sets the cap: 100% off, 150% on. bindel is locked + repeating, so
# a held key keeps stepping and the keys work over the lock screen. The OSD follows
# the PipeWire change itself, with or without the daemon. Replaces the two wpctl
# volume binds; the mute bind stays as it is.
bindel = , XF86AudioRaiseVolume, exec, zenith-volume up
bindel = , XF86AudioLowerVolume, exec, zenith-volume down

# Recover audio when sound stops coming back: restarts the PipeWire stack.
bind = SUPER SHIFT, A, exec, zenith-restart-audio

