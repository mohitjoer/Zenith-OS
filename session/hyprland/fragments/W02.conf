# Super+Tab opens the workspace overview, an expo of live window previews. Super+Alt+Tab
# opens it on the next desktop, or steps to the next desktop when it is already up
# (`overviewDesktop -1` goes back).
bind = SUPER, Tab, exec, zenith ipc call zenith toggleOverview
bind = SUPER ALT, Tab, exec, zenith ipc call zenith overviewDesktop 1

# Alt+Tab is the most-recently-used window switcher: a press moves to the next window
# and focuses it, Shift walks the list the other way, and the card stays 450 ms after
# the last press or release. The release is `bindr`. `bindl` is the lock-screen flag, it
# fires on the press, so a press/`bindl` pair opened and closed the card in the same
# instant. A release bind needs Alt still held, so the second pair covers Shift, and the
# card ends itself after the dwell when Alt came up first.
bind = ALT, Tab, exec, zenith ipc call zenith advanceSwitcher
bind = ALT SHIFT, Tab, exec, zenith ipc call zenith reverseSwitcher
bindr = ALT, Tab, exec, zenith ipc call zenith closeSwitcher
bindr = ALT SHIFT, Tab, exec, zenith ipc call zenith closeSwitcher

# The overview is a full-screen layer: blur the desktop behind it so only the cells and
# their previews read, and leave the animation to the shell.
layerrule = blur on, match:namespace ^overview$
layerrule = no_anim on, match:namespace ^overview$

