# Brightness keys. They go through zenith-cmd-brightness -> `zenith brightness`,
# which asks systemd-logind to write the value, so no group is needed. This
# replaces the two brightnessctl binds, which the sysfs file refuses on every
# laptop whose user is not in `video`. The l flag keeps the keys working over the
# lock screen and e repeats while the key is held.
bindel = , XF86MonBrightnessUp, exec, zenith-cmd-brightness +5
bindel = , XF86MonBrightnessDown, exec, zenith-cmd-brightness -5

# Keyboard backlight keys, for laptops whose driver reports them as key events.
# The ASUS driver here steps the LED itself and never reports them, so these do
# not double the step on this machine.
bindel = , XF86KbdBrightnessUp, exec, zenith brightness up --device kbd
bindel = , XF86KbdBrightnessDown, exec, zenith brightness down --device kbd

# The Fn touchpad key. Hyprland has no read-back for a device's state, so
# zenith-touchpad keeps the intent in the runtime directory.
bindl = , XF86TouchpadToggle, exec, zenith-touchpad toggle
bindl = , XF86TouchpadOn, exec, zenith-touchpad on
bindl = , XF86TouchpadOff, exec, zenith-touchpad off

# Hyprland enables every touchpad again when it rereads its config, and `exec`
# (unlike exec-once) runs again on every reload, so a pad that was turned off
# stays off. It does nothing when the pad is on.
exec = zenith-touchpad restore

# For session/binds.json (lane W01): brightness-up and brightness-down become
# kind app, action zenith-cmd-brightness, argument +5 and -5. New entries, kind
# app: kbd-brightness-up / kbd-brightness-down (XF86KbdBrightnessUp / Down, action
# zenith, argument "brightness up --device kbd" / "brightness down --device kbd"),
# touchpad-toggle / touchpad-on / touchpad-off (XF86TouchpadToggle / On / Off,
# action zenith-touchpad, argument toggle / on / off), category display.

