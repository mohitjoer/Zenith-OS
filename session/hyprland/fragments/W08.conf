# The Hub's key recorder (Settings > Keybinds) enters this submap with
# `hyprctl dispatch submap record` while it waits for a chord, so a live chord
# such as SUPER + Q reaches the Hub window to be read instead of firing. In a
# submap only its own binds run, and Escape is the one of them: a way back to
# the normal keymap even if the Hub goes away while the submap is active, so the
# keyboard is never stranded in record mode.
submap = record
bind = , Escape, submap, reset
submap = reset

# Settings > Performance (and the shell's Power Saver) switch compositor blur and
# shadows off through JSON files hyprlang cannot read. This script reads them and
# applies the result with `hyprctl keyword`. `exec` rather than `exec-once`, so a
# reload, which is how the Performance page applies a changed switch, runs it
# again. It changes nothing when every switch is off. It lives in /usr/bin
# (release/build.d/W08.build).
exec = zenith-perf-apply

