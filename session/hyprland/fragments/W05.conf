# The wallpaper picker is a full-screen layer surface that draws and animates its
# own open/close; the compositor's layer animation on top of it would play twice.
# Its card is translucent, so it is blurred (ignore_alpha keeps the frost off the
# clear surround). The daemon is a systemd unit, so there is no exec-once.
layerrule = no_anim on, match:namespace ^wallpaper-selector-parallel$
layerrule = blur on, match:namespace ^wallpaper-selector-parallel$
layerrule = ignore_alpha 0.05, match:namespace ^wallpaper-selector-parallel$

