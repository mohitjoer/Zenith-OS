# The SPICE console quickemu opens for a running machine (spicy, from
# spice-client-gtk; remote-viewer when that is what is installed). Ryoku floated
# and centred it; without this it tiles into whatever workspace is in front.
# The VM window's own rule (title zenith-vm) is already in window-rules.conf.
windowrule {
    name = float-spice-console
    match:class = ^([Ss]picy|[Rr]emote-viewer)$
    float = on
    center = on
}

