# The first-run welcome tour. The wrapper checks ~/.local/state/zenith/welcome-done
# itself and exits at once when it exists, so this line is safe at every login.
exec-once = /usr/bin/zenith-welcome --if-first-run

# The tour is an ordinary window (not a layer surface): float and centre it by
# its title, which welcome.qml deliberately leaves untranslated. Hyprland clamps
# this size to the window's own maximumSize on a small screen.
windowrule = float on, size 1180 760, center on, match:title ^(Welcome to Zenith)$

