# The lid switch hands the panel over to an external display. asura-clamshell
# has no Asura port yet; until it exists these do nothing and logind's own lid
# policy (suspend, or ignore when docked) applies. Kept live while locked.
bindl = , switch:on:Lid Switch, exec, command -v asura-clamshell >/dev/null 2>&1 && asura-clamshell lid close
bindl = , switch:off:Lid Switch, exec, command -v asura-clamshell >/dev/null 2>&1 && asura-clamshell lid open
exec = command -v asura-clamshell >/dev/null 2>&1 && asura-clamshell lid sync
