# The lid switch hands the panel over to an external display. zenith-clamshell
# has no Zenith port yet; until it exists these do nothing and logind's own lid
# policy (suspend, or ignore when docked) applies. Kept live while locked.
bindl = , switch:on:Lid Switch, exec, command -v zenith-clamshell >/dev/null 2>&1 && zenith-clamshell lid close
bindl = , switch:off:Lid Switch, exec, command -v zenith-clamshell >/dev/null 2>&1 && zenith-clamshell lid open
exec = command -v zenith-clamshell >/dev/null 2>&1 && zenith-clamshell lid sync
