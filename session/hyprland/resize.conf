# Resize mode. Super+R (binds.conf) enters this submap and shows a toast; arrows
# or hjkl grow and shrink the active window, and Escape, Return or Super+R hand
# control back. The submap is exclusive, so bare arrows resize here without
# fighting the global Super+arrow focus. Super+Ctrl+arrows do the same without
# entering a mode.
submap = resize
binde = , Left, resizeactive, -40 0
binde = , Right, resizeactive, 40 0
binde = , Up, resizeactive, 0 -40
binde = , Down, resizeactive, 0 40
binde = , h, resizeactive, -40 0
binde = , l, resizeactive, 40 0
binde = , k, resizeactive, 0 -40
binde = , j, resizeactive, 0 40
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = SUPER, R, submap, reset
submap = reset

# The Hub's key recorder (Settings > Keybinds) enters this submap with
# `hyprctl dispatch submap record` while it waits for a chord, so a live chord
# such as SUPER + Q reaches the Hub window to be read instead of firing. In a
# submap only its own binds run; Escape is the one of them, a way back to the
# normal keymap even if the Hub goes away while the submap is active.
submap = record
bind = , Escape, submap, reset
submap = reset
