# Asura's compositor configuration.
#
# Installed at /usr/share/asura/hyprland/hyprland.conf and loaded by the
# session with `Hyprland -c`. This file only says what is read and in what
# order; each part is one concern. Relative sources resolve against this file's
# directory. The order is: environment, monitors, input, look, binds,
# rules, autostart, then the files the user and the Hub own, so the last word
# is always the user's.
#
# The keys are in binds.conf, and session/binds.json is the same list written
# for a person: `asura doctor` compares the two in both directions. Shell
# surfaces are called as `asura ipc call asura <function>`, which finds the
# running shell, so a key works whichever tree the shell runs from.

source = env.conf
source = monitors.conf
source = input.conf
source = misc.conf
source = decoration.conf
source = animations.conf
source = binds.conf
source = resize.conf
source = lid.conf
source = window-rules.conf
source = layer-rules.conf
source = autostart.conf

# The session's anchor. The compositor is up by the time this runs, which is
# the first moment the display exists, and asura-activate puts the
# compositor's environment into the user manager before starting the target that
# pulls in the portal dispatcher and the shell. A unit that starts without the
# display refuses to, so it is the compositor that runs this, not the session.
exec-once = /usr/share/asura/session/asura-activate

# State that belongs to the user and to the tools, in this order; the last
# file wins. They live in ~/.config/asura/hyprland/ (Hyprland expands only
# `~`), are written by someone else, and do not exist until that someone first
# writes them, so a missing one must not be an error. Hyprland has no optional
# source; `noerror` is the only way, and it also hides a typo inside these
# files, so check an edited one with `Hyprland --verify-config -c <file>`.
#
#   monitors-auto.conf   asura-monitor: per-output scale and layout
#   monitors-user.conf   the user's pins; asura-monitor never touches it
#   settings.conf        Settings: input, look, animations (asura-hubd writes it)
#   rebinds.conf         Settings > Keybinds: an `unbind =` + `bind =` pair each
#   asura.conf          the old name of user.conf, still read
#   user.conf            the user's own overrides
#
# These stay out of /usr/share/asura/hyprland/ on purpose: `asura materialize`
# overwrites that directory's copies with the packaged ones.
# hyprlang noerror true
source = ~/.config/asura/hyprland/monitors-auto.conf
source = ~/.config/asura/hyprland/monitors-user.conf
source = ~/.config/asura/hyprland/settings.conf
source = ~/.config/asura/hyprland/rebinds.conf
source = ~/.config/asura/hyprland/asura.conf
source = ~/.config/asura/hyprland/user.conf
source = ~/.config/asura/hyprland/vm-perf.conf
# hyprlang noerror false
