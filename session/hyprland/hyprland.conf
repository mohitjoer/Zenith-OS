# Zenith's compositor configuration.
#
# Hyprland is the compositor, and this file is the only place that says what
# the keyboard does. Everything else — the bar, the dock, the launcher — is the
# shell's, and the shell is *told* about a keypress rather than deciding what a
# keypress means.
#
# That division is the seam the architecture record calls `zenith wm`: the
# compositor is replaceable, and what a key means belongs to the shell.
#
# It is installed at /usr/share/zenith/hyprland/hyprland.conf and loaded by the
# session with `Hyprland -c`. The user's own file is sourced last, so a user
# can override anything here without editing a packaged file.

# The monitor. "preferred" lets the compositor pick the mode and "auto" the
# scale, which is what a machine nobody has measured wants.
monitor=,preferred,auto,1

# The launcher.
#
# The bind names the shell's IPC target and nothing else. The compositor says
# when Super+Space was pressed; the shell decides what that means. A bind that
# ran the launcher itself would be a second implementation of the launcher, in
# a file that has no tests.
bind = SUPER, Space, exec, quickshell ipc call zenith togglePopover launcher

# The window switcher. Pressed, it advances; released, it closes.
bind = SUPER, Tab, exec, quickshell ipc call zenith advanceSwitcher
bindl = SUPER, Tab, exec, quickshell ipc call zenith closeSwitcher

# The quick settings.
bind = SUPER, S, exec, quickshell ipc call zenith togglePopover quick

# The user's own configuration, sourced last so it can override anything
# above.
#
# A path rather than a glob, and it has to exist: Hyprland treats a source
# that resolves to nothing as a configuration error and refuses to start, so
# the session creates this file — empty, in the user's own configuration
# directory — before the compositor reads it.
source = ~/.config/zenith/hyprland/zenith.conf
