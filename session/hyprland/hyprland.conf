# Zenith's compositor configuration.
#
# Hyprland is the compositor, and this file is the only place that says what
# the keyboard does. Everything else — the bar, the dock, the launcher — is the
# shell's, and the shell is *told* about a keypress rather than deciding what a
# keypress means.
#
# That division is the seam the architecture record calls `zenith wm`: the
# compositor is replaceable, and what a key means belongs to the shell.
#
# It is installed at /usr/share/zenith/hyprland/hyprland.conf and loaded by the
# session with `Hyprland -c`. The user's own file is sourced last, so a user
# can override anything here without editing a packaged file.

# The monitor. "preferred" lets the compositor pick the mode and "auto" the
# scale, which is what a machine nobody has measured wants.
monitor=,preferred,auto,1

# The keyboard, and the list it is written down in.
#
# The catalogue is session/binds.json, and it is the list of what the keyboard
# does: every chord below is in it, with a label and a category, and the shell
# draws it as a cheat sheet. `zenith doctor` compares the two, in both
# directions, so a chord that is here and not there — or a chord there that is
# not here — is a fault before anybody logs in.
#
# The wording of a chord is the catalogue's: the same modifier names, in the
# same order, and the same key spellings. What the catalogue writes as
# "SUPER + SHIFT + 1" is written here as "SUPER SHIFT, 1", because Hyprland's
# own syntax is comma-separated and a configuration it cannot parse is a
# compositor that refuses to start. The difference is a separator and nothing
# else, and it is the compositor's constraint rather than a style choice:
# Hyprland reads this file and understands no JSON, so the catalogue cannot be
# this file and this file cannot be the catalogue. The two are kept in step by
# a check rather than by a convention anybody has to remember.
#
# The calls into the shell go through the control tool rather than at
# quickshell directly, and that is deliberate. The compositor knows only that
# a key was pressed; which instance of the shell is running — the one the
# package installed, or one a development tree started — is not the
# compositor's to name, and an IPC call that dials a path dials it whether or
# not anything is listening there. `zenith ipc` finds the running instance's
# own path in the process table and forwards the call, so the key works
# whichever tree the shell is running from. The target and the verb are the
# shell's, unchanged.

# The launcher.
#
# The bind names the shell's IPC target and nothing else. The compositor says
# when Super+Space was pressed; the shell decides what that means. A bind that
# ran the launcher itself would be a second implementation of the launcher, in
# a file that has no tests.
bind = SUPER, Space, exec, zenith ipc call zenith togglePopover launcher

# The window switcher. Pressed, it advances; released, it closes.
#
# Two binds for one chord, because the switcher is told when the key goes down
# and when it comes up: a switcher that only knew about the press would keep
# its overlay up after the user let go of the key.
bind = SUPER, Tab, exec, zenith ipc call zenith advanceSwitcher
bindl = SUPER, Tab, exec, zenith ipc call zenith closeSwitcher

# The quick settings.
bind = SUPER, S, exec, zenith ipc call zenith togglePopover quick

# The cheat sheet: every chord on this page, grouped and labelled, so that a
# key nobody remembers can be looked up rather than guessed at.
bind = SUPER, K, exec, zenith ipc call zenith toggleCheatsheet

# A terminal.
#
# The one thing a session cannot do without, and the one thing the shell does
# not provide: the shell's launcher is a launcher, not a list of what is
# installed, and a desktop whose only way into a terminal is a launcher that
# cannot list applications is a desktop with no way into a terminal.
#
# It is bound rather than started, so that the session does not carry a
# terminal that the user never asked for.
bind = SUPER, T, exec, ghostty

# The screen lock.
#
# The shell owns *when* to lock and the locker does the locking, because a
# QML lock screen cannot authenticate against PAM. Which is why this is the
# locker itself and not a call into the shell: the shell's own answer would be
# the same binary with one more step in it.
bind = SUPER, L, exec, hyprlock

# The windows.
#
# The compositor's own actions rather than the shell's, because they are
# things the compositor already knows how to do and a bind that asked the
# shell to do them would be a bind that ran a program to change a window.
#
# "fullscreen 1" maximises and "fullscreen 0" fullscreens, which is
# Hyprland's own numbering: one is the maximised mode and anything else is
# the fullscreen one.
bind = SUPER, Q, killactive,
bind = SUPER, D, fullscreen, 1
bind = SUPER, F, fullscreen, 0
bind = SUPER, A, togglefloating,

# The focus, and the window itself.
#
# The arrow keys move the focus and the same keys with Shift move the window,
# which is the arrangement every other desktop has settled on and the one
# that costs the user nothing to learn.
bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d
bind = SUPER SHIFT, Left, movewindow, l
bind = SUPER SHIFT, Right, movewindow, r
bind = SUPER SHIFT, Up, movewindow, u
bind = SUPER SHIFT, Down, movewindow, d

# The workspaces.
#
# Ten of them, one per key, and the last of them is the 0 key rather than a
# tenth key: the number row has no room for a tenth digit, so 0 is the tenth
# workspace. The catalogue says the same thing with a placeholder, and the
# placeholder takes the number of the position rather than the key.
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# The laptop's own keys.
#
# No modifier, because the keyboard sends them without one and a bind that
# waited for a modifier would never fire. They are the multimedia keys the
# machine's hardware already has, and the actions are the ones the base layer
# ships the tools for.
bind = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioPlay, exec, playerctl play-pause
bind = ,XF86AudioPause, exec, playerctl play-pause
bind = ,XF86AudioNext, exec, playerctl next
bind = ,XF86AudioPrev, exec, playerctl previous
bind = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bind = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# The overview layer — blur the backdrop so the workspace preview reads cleanly.
layerrule = blur quickshell:overview

# A screenshot, through the shell's own capture flow.
#
# The print key opens the capture tab in quick settings, where the shell
# takes the shot itself with the compositor's screencopy, so nothing
# external has to be installed and the shot lands in a flow that previews
# it before it is saved. Both the print key and its XF86 twin are bound,
# because keyboard makers are not consistent about which one the Fn row
# emits.
bind = ,Print, exec, zenith ipc call zenith toggleScreenshot
bind = ,XF86Print, exec, zenith ipc call zenith toggleScreenshot

# The session's anchor.
#
# The compositor is up by the time this runs, which is the first moment the
# display exists, and the script puts the compositor's environment into the
# user manager before starting the target that pulls in the portal dispatcher
# and the shell. Both of them check the display before they do anything, and
# a unit that starts without the display in its environment refuses to.
#
# It is the compositor that runs it because the compositor is what knows the
# display. The session script cannot start the target before the compositor,
# because the target is what starts the shell, and the shell needs the
# compositor.
exec-once = /usr/share/zenith/session/zenith-activate

# The user's own configuration, sourced last so it can override anything
# above.
#
# A path rather than a glob, and it has to exist: Hyprland treats a source
# that resolves to nothing as a configuration error and refuses to start, so
# the session creates this file — empty, in the user's own configuration
# directory — before the compositor reads it.
source = ~/.config/zenith/hyprland/zenith.conf
