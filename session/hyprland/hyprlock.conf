# Zenith's lock screen. hyprlock draws it and asks PAM for the password; when to
# lock is hypridle's business (hypridle.conf), not this file's.
#
# Monochrome on the 4px grid, radii from the design scale. The only colours are
# red for a wrong password and amber for Caps Lock. Every key is one hyprlock
# 0.9.2 reads.

general {
    ignore_empty_input = true
    # Paint the background colour at once instead of waiting for the blurred image.
    immediate_render = true
}

# The wallpaper, blurred and dimmed until light text clears 4.5:1 on any image.
# The path is a symlink the shell keeps at the current wallpaper (shell/Idle.qml);
# when it is missing, or points at a video, hyprlock draws the colour instead.
background {
    path = $HOME/.config/zenith/current/background
    color = rgba(16, 16, 16, 1.0)
    blur_passes = 3
    brightness = 0.4
}

label {
    text = $TIME
    font_size = 96
    font_family = Space Grotesk
    color = rgba(242, 242, 242, 1.0)
    position = 0, 144
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date '+%A, %-d %B'
    font_size = 20
    font_family = Space Grotesk
    color = rgba(204, 204, 204, 1.0)
    position = 0, 68
    halign = center
    valign = center
}

input-field {
    size = 280, 48
    position = 0, -32
    halign = center
    valign = center
    rounding = 12
    outline_thickness = 1
    outer_color = rgba(242, 242, 242, 0.32)
    inner_color = rgba(16, 16, 16, 0.6)
    font_color = rgba(242, 242, 242, 1.0)
    font_family = Space Grotesk
    placeholder_text = Password
    fade_on_empty = false
    check_color = rgba(204, 204, 204, 1.0)
    fail_color = rgba(220, 38, 38, 1.0)
    capslock_color = rgba(245, 165, 36, 1.0)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Battery percentage, top right. Prints nothing on a machine without a battery.
label {
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n 1 | sed 's/.*/&%/'
    font_size = 16
    font_family = Space Grotesk
    color = rgba(204, 204, 204, 1.0)
    position = -32, -32
    halign = right
    valign = top
}

# What is playing, bottom centre. Prints nothing without playerctl or a player.
# The braces are escaped because hyprlang would read a bare pair as arithmetic,
# and the sed escapes & because label text is Pango markup.
label {
    text = cmd[update:2000] playerctl metadata --format '\{{ artist }} - \{{ title }}' 2>/dev/null | sed 's/&/\&amp;/g'
    font_size = 16
    font_family = Space Grotesk
    color = rgba(204, 204, 204, 1.0)
    position = 0, 32
    halign = center
    valign = bottom
}
