# One-shot login tasks. Daemons are not started here: systemd units start them
# (zenith-activate in hyprland.conf pulls the session target in). Each line is
# guarded so a tool Zenith does not have yet is skipped rather than failing.

# Scale each display from its real pixel density and write monitors-auto.conf.
# Opt-in: this does nothing until `zenith-monitor autoscale on` (Settings >
# Displays) has been run, so a panel keeps the scale it has. Pins in
# monitors-user.conf are left alone.
exec-once = command -v zenith-monitor >/dev/null 2>&1 && zenith-monitor autoscale --at-login

# Folder icons follow the wallpaper palette; the shell re-runs this on a palette change.
exec-once = command -v zenith-cmd-folders >/dev/null 2>&1 && zenith-cmd-folders

# hyprsunset-style tools are a plain process a reboot drops: restore the warm
# screen when the user left it on. A no-op when it was off.
exec-once = command -v zenith-cmd-nightlight >/dev/null 2>&1 && zenith-cmd-nightlight restore

# First-boot experience: On the Live ISO, auto-launch the guided installer in Ghostty.
# On an installed system, auto-launch the first-run welcome tour.
exec-once = sh -c 'if [ -f /etc/zenith-live ] || grep -qE "boot=live|live" /proc/cmdline 2>/dev/null; then ghostty --title="Zento OS Installer" -e sudo /usr/bin/zenith-installer; else /usr/bin/zenith-welcome --if-first-run; fi'



# Render the background wallpaper immediately so the workspace is never blank
exec-once = command -v swaybg >/dev/null 2>&1 && swaybg -i ~/.config/zenith/current/background -m fill


