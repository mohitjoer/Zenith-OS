# One-shot login tasks. Daemons are not started here: systemd units start them
# (asura-activate in hyprland.conf pulls the session target in). Each line is
# guarded so a tool Asura does not have yet is skipped rather than failing.

# Scale each display from its real pixel density and write monitors-auto.conf.
# Opt-in: this does nothing until `asura-monitor autoscale on` (Settings >
# Displays) has been run, so a panel keeps the scale it has. Pins in
# monitors-user.conf are left alone.
exec-once = command -v asura-monitor >/dev/null 2>&1 && asura-monitor autoscale --at-login

# Folder icons follow the wallpaper palette; the shell re-runs this on a palette change.
exec-once = command -v asura-cmd-folders >/dev/null 2>&1 && asura-cmd-folders

# hyprsunset-style tools are a plain process a reboot drops: restore the warm
# screen when the user left it on. A no-op when it was off.
exec-once = command -v asura-cmd-nightlight >/dev/null 2>&1 && asura-cmd-nightlight restore

# Dismiss Plymouth boot splash once Hyprland surface is active
exec-once = command -v plymouth >/dev/null 2>&1 && (plymouth --quit 2>/dev/null || sudo -n plymouth --quit 2>/dev/null || true)

# First-boot experience: On the Live ISO, display a friendly welcome notification
# allowing the user to explore and test the system freely before installing.
# On an installed system, auto-launch the first-run welcome tour.
exec-once = sh -c 'if [ -f /etc/asura-live ] || grep -qE "boot=live|live" /proc/cmdline 2>/dev/null; then command -v notify-send >/dev/null 2>&1 && sleep 2 && notify-send -u normal -a "Asura OS" "Welcome to Asura OS" "Explore and test the live environment freely. Launch Install Asura OS from the desktop or launcher when ready."; else /usr/bin/asura-welcome --if-first-run; fi'



# Render the background wallpaper immediately so the workspace is never blank
exec-once = command -v swaybg >/dev/null 2>&1 && swaybg -i ~/.config/asura/current/background -m fill


