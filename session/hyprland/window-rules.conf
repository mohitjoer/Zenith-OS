# Window rules, translated from Ryoku's window_rules.lua. Rules run top to
# bottom and the last match wins. Sizes are proportions of the monitor rather
# than Ryoku's min(fixed, 92%): 0.53's expression evaluator has no min(), and
# these equal the fixed sizes on a 1920x1080 panel while never exceeding a
# small one (a window sized past its monitor reads as a broken fullscreen).

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus, class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrulev2 = float, class:(pavucontrol|nm-connection-editor|blueman-manager|org.kde.polkit-kde-authentication-agent-1|xdg-desktop-portal-gtk)
windowrulev2 = float, class:hyprpolkitagent
windowrulev2 = center, class:hyprpolkitagent
windowrulev2 = float, title:(Open File|Save File|Save As|Choose Files|Open Folder)
windowrulev2 = float, class:[Ss]potify
windowrulev2 = float, class:org.gnome.Nautilus
windowrulev2 = size 78% 79%, class:org.gnome.Nautilus
windowrulev2 = center, class:org.gnome.Nautilus
windowrulev2 = float, class:^([Tt]hunar)$
windowrulev2 = size 78% 79%, class:^([Tt]hunar)$
windowrulev2 = center, class:^([Tt]hunar)$

# Settings asks for 99% of the monitor so it stays proportional on any screen.
windowrulev2 = float, title:^Zenith Settings$
windowrulev2 = size 99% 96%, title:^Zenith Settings$
windowrulev2 = center, title:^Zenith Settings$
windowrulev2 = float, title:^(Zenith Store)$
windowrulev2 = size 61% 70%, title:^(Zenith Store)$
windowrulev2 = center, title:^(Zenith Store)$

# qs paints its first frame slowly on a hybrid GPU (Mesa falls back off the
# NVIDIA node), so the pop-in would show the uninitialised surface as streaks.
windowrulev2 = float, title:^(zenith-vm)$
windowrulev2 = size 61% 70%, title:^(zenith-vm)$
windowrulev2 = center, title:^(zenith-vm)$
windowrulev2 = noanim, title:^(zenith-vm)$
windowrulev2 = float, class:zenith-store
windowrulev2 = size 47% 56%, class:zenith-store
windowrulev2 = center, class:zenith-store
windowrulev2 = float, class:looking-glass-client
windowrulev2 = size 83% 83%, class:looking-glass-client
windowrulev2 = center, class:looking-glass-client
windowrulev2 = float, class:[Qq]emu
windowrulev2 = size 67% 74%, class:[Qq]emu
windowrulev2 = center, class:[Qq]emu

# The first-run welcome tour is an ordinary window (not a layer surface), floated
# and centred by its title, which welcome.qml leaves untranslated. Hyprland
# clamps the size to the window's own maximumSize on a small screen. (W14)
windowrulev2 = float, title:^(Welcome to (Zenith|Zento))$
windowrulev2 = size 1180 760, title:^(Welcome to (Zenith|Zento))$
windowrulev2 = center, title:^(Welcome to (Zenith|Zento))$

# The Zento Installer runs inside Ghostty with title "Zento OS Installer".
windowrulev2 = float, title:^((Zenith|Zento) OS Installer)$
windowrulev2 = size 960 680, title:^((Zenith|Zento) OS Installer)$
windowrulev2 = center, title:^((Zenith|Zento) OS Installer)$



# Steam is an XWayland app. Big Picture, the client, launched games and
# gamescope would otherwise inherit the desktop's blur, shadow and the 0.94
# inactive opacity, which turns a game translucent the moment focus leaves it.
# Idle is inhibited while fullscreen because hypridle has no fullscreen
# exception. `immediate` lets an unthrottled game tear (general:allow_tearing).
windowrulev2 = noblur, class:^(steam|steam_app_.*|gamescope)$
windowrulev2 = noshadow, class:^(steam|steam_app_.*|gamescope)$
windowrulev2 = opaque, class:^(steam|steam_app_.*|gamescope)$
windowrulev2 = idleinhibit fullscreen, class:^(steam|steam_app_.*|gamescope)$
windowrulev2 = immediate, class:^(steam|steam_app_.*|gamescope)$

# Chromium's "<site> is sharing a window." bar maps with an empty app_id and
# takes no pointer input, so it is parked on a special workspace nobody opens.
# "silent" is load-bearing: without it the rule opens special:sharebar and the
# bar stays on screen. The patterns are full matches, hence the .* on both ends.
windowrulev2 = workspace special:sharebar silent, class:^$, title:^(.*is sharing.*)$
windowrulev2 = nofocus, class:^$, title:^(.*is sharing.*)$

# The SPICE console quickemu opens for a running machine (spicy, or
# remote-viewer when that is what is installed). Without this it tiles into
# whatever workspace is in front.
windowrulev2 = float, class:^([Ss]picy|[Rr]emote-viewer)$
windowrulev2 = center, class:^([Ss]picy|[Rr]emote-viewer)$
