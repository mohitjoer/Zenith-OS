# Window rules, translated from Ryoku's window_rules.lua. Rules run top to
# bottom and the last match wins. Sizes are proportions of the monitor rather
# than Ryoku's min(fixed, 92%): 0.53's expression evaluator has no min(), and
# these equal the fixed sizes on a 1920x1080 panel while never exceeding a
# small one (a window sized past its monitor reads as a broken fullscreen).

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-system-dialogs
    match:class = (pavucontrol|nm-connection-editor|blueman-manager|org.kde.polkit-kde-authentication-agent-1|xdg-desktop-portal-gtk)
    float = on
}

windowrule {
    name = float-polkit-agent
    match:class = hyprpolkitagent
    float = on
    center = on
}

windowrule {
    name = float-file-pickers
    match:title = (Open File|Save File|Save As|Choose Files|Open Folder)
    float = on
}

windowrule {
    name = float-spotify
    match:class = [Ss]potify
    float = on
}

windowrule {
    name = float-nautilus
    match:class = org.gnome.Nautilus
    float = on
    size = (monitor_w*0.78) (monitor_h*0.79)
    center = on
}

# Settings asks for 99% of the monitor so it stays proportional on any screen.
windowrule {
    name = float-zenith-settings
    match:title = ^Zenith Settings$
    float = on
    size = (monitor_w*0.99) (monitor_h*0.96)
    center = on
}

windowrule {
    name = float-zenith-store
    match:title = ^(Zenith Store)$
    float = on
    size = (monitor_w*0.61) (monitor_h*0.70)
    center = on
}

# qs paints its first frame slowly on a hybrid GPU (Mesa falls back off the
# NVIDIA node), so the pop-in would show the uninitialised surface as streaks.
windowrule {
    name = float-zenith-vm
    match:title = ^(zenith-vm)$
    float = on
    size = (monitor_w*0.61) (monitor_h*0.70)
    center = on
    no_anim = on
}

windowrule {
    name = float-zenith-store-app
    match:class = zenith-store
    float = on
    size = (monitor_w*0.47) (monitor_h*0.56)
    center = on
}

windowrule {
    name = float-looking-glass
    match:class = looking-glass-client
    float = on
    size = (monitor_w*0.83) (monitor_h*0.83)
    center = on
}

windowrule {
    name = float-qemu
    match:class = [Qq]emu
    float = on
    size = (monitor_w*0.67) (monitor_h*0.74)
    center = on
}

# The first-run welcome tour is an ordinary window (not a layer surface), floated
# and centred by its title, which welcome.qml leaves untranslated. Hyprland
# clamps the size to the window's own maximumSize on a small screen. (W14)
windowrule = float on, size 1180 760, center on, match:title ^(Welcome to Zenith)$

# Steam is an XWayland app. Big Picture, the client, launched games and
# gamescope would otherwise inherit the desktop's blur, shadow and the 0.94
# inactive opacity, which turns a game translucent the moment focus leaves it.
# Idle is inhibited while fullscreen because hypridle has no fullscreen
# exception. `immediate` lets an unthrottled game tear (general:allow_tearing).
windowrule {
    name = steam-native
    match:class = ^(steam|steam_app_.*|gamescope)$
    no_blur = on
    no_shadow = on
    opaque = on
    idle_inhibit = fullscreen
    immediate = on
}

# Chromium's "<site> is sharing a window." bar maps with an empty app_id and
# takes no pointer input, so it is parked on a special workspace nobody opens.
# "silent" is load-bearing: without it the rule opens special:sharebar and the
# bar stays on screen. The patterns are full matches, hence the .* on both ends.
windowrule {
    name = park-chromium-share-indicator
    match:class = ^$
    match:title = ^(.*is sharing.*)$
    workspace = special:sharebar silent
    no_focus = on
}

# The SPICE console quickemu opens for a running machine (spicy, or
# remote-viewer when that is what is installed). Without this it tiles into
# whatever workspace is in front.
windowrule {
    name = float-spice-console
    match:class = ^([Ss]picy|[Rr]emote-viewer)$
    float = on
    center = on
}
