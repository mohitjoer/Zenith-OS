# Layer rules, translated from Ryoku's decoration.lua. The launcher, overview and
# notifications animate themselves in QML, so the compositor's own layer
# animation is switched off to avoid a double move. ignore_alpha keeps the blur
# inside the card: the launcher's surface reserves a transparent margin for its
# shadow, and blurring that reads as a frosted square around it.

# ^launcher also matches launcher-noblur, the namespace used when the launcher's
# blur is 0; blur is scoped to the exact namespace so that one is never frosted.
layerrule = no_anim on, match:namespace ^launcher
layerrule = blur on, ignore_alpha 0.05, match:namespace ^launcher$

layerrule = no_anim on, match:namespace ^zenith-notifications$

# The workspace overview is a full-screen layer: blur the desktop behind it so
# only the cells and their live previews read on top.
layerrule = blur on, no_anim on, match:namespace ^overview$

# Wallpaper surfaces ride the background layer. The global `layers` popin
# scale-pops them and reads as a flicker, so they fade instead.
layerrule = animation fade, match:namespace ^(zenith-wallpaper|awww-daemon|zenith-livewall|mpvpaper|phonto)$

# The wallpaper picker is a full-screen layer that draws and animates its own
# open/close, so the compositor's layer animation would play twice. Its card is
# translucent: ignore_alpha keeps the frost off the clear surround.
layerrule = no_anim on, blur on, ignore_alpha 0.05, match:namespace ^wallpaper-selector-parallel$
