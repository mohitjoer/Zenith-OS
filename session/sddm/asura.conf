# asura greeter drop-in
#
# Packaged at /usr/share/asura/session/sddm/asura.conf and never installed by
# a package. `asura greeter enable` prints the one command that copies it to
# /etc/sddm.conf.d/10-asura.conf, and `asura greeter disable` prints the one
# that removes it. Until that file exists SDDM runs exactly as the base layer
# ships it, so installing Asura cannot change the login screen on its own.
#
# If the login screen is ever broken, switch to a text console (Ctrl+Alt+F3),
# log in, and run: sudo rm /etc/sddm.conf.d/10-asura.conf
# docs/greeter.md has the whole recovery path.

[General]
# The greeter is a Wayland client of a kiosk Weston. There is no session yet to
# borrow a compositor from, and Asura carries no X server.
DisplayServer=wayland

[Wayland]
CompositorCommand=/usr/share/asura/session/asura-greeter

[Theme]
# The theme stays inside /usr/share/asura, so nothing is registered in SDDM's
# own theme directory. If it goes missing SDDM falls back to its built-in theme,
# which can still log in.
ThemeDir=/usr/share/asura/session/sddm/themes
Current=asura
