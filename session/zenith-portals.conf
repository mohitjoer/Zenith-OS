# Zenith portal backend preference.
#
# Packaged at /usr/share/zenith/session/zenith-portals.conf. Adoption writes the
# *user* file at ~/.config/xdg-desktop-portal/zenith-portals.conf rather than the
# system one, for three reasons: it needs no root, it is a single `rm` away, and
# it does not modify a file a base-layer package owns.
#
# The interface names carry a `org.gnome.impl.portal.` prefix and mean nothing
# about whether GNOME is installed — that namespace predates anyone having an
# opinion about this.
#
# GlobalShortcuts is deliberately absent. The Hyprland backend does not
# implement it, no other backend does either, and naming an unimplemented backend
# in `use=` produces a dispatcher error rather than a useful fallback. The shell
# owns global shortcuts directly.
#
# Secret is provided by xdg-desktop-portal-lxqt.
#
# It used to name gtk, which does not implement Secret — so the interface was
# configured to a backend that could not serve it, which is worse than naming no
# backend at all, because a reader checking the file sees a confident answer.
#
# The choice is the light one. xdg-desktop-portal-kde also implements Secret and
# is in the archive, but it depends on libkf6notifications6, and a second
# notification daemon on a desktop whose shell owns that bus name is a race. The
# lxqt backend pulls libfm-qt6, libkf6windowsystem6 and Qt6's core, dbus, gui
# and widgets, and nothing that competes with the shell.

[default]
use=hyprland;

[org.gnome.impl.portal.ScreenCast]
use=hyprland;

[org.gnome.impl.portal.Screenshot]
use=hyprland;

[org.gnome.impl.portal.FileChooser]
use=gtk;

[org.gnome.impl.portal.OpenURI]
use=gtk;

[org.gnome.impl.portal.Print]
use=gtk;

[org.gnome.impl.portal.Secret]
use=lxqt;

# Access is the one that was silently breaking Camera.
#
# Camera is not a backend interface. It is implemented by xdg-desktop-portal
# itself — desktop-portal/camera.c is part of the dispatcher binary, not a
# backend — and it opens PipeWire only after asking an Access backend whether the
# user consents. No backend implements Camera, so the obvious reading of "no
# backend has Camera" is that Camera is unsupported. It is not: the dispatcher
# has had it all along, and it was never reaching a backend that could consent.
#
# With [default] set to hyprland, an interface nothing names falls to the
# default, so Access was being asked of the Hyprland backend — which does not
# implement it. The dispatcher's own Camera portal has therefore been unable to
# open a device on this desktop. gtk does implement Access, and naming it
# explicitly is the whole fix.
#
# This does not change Screenshot. The Hyprland backend implements Screenshot
# itself and never goes through the dispatcher's Access path; Access is consulted
# for the portals the dispatcher implements directly.
[org.gnome.impl.portal.Access]
use=gtk;
