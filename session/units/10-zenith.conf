# SDDM preferences for the Zenith session.
#
# SDDM reads drop-ins from /etc/sddm.conf.d/ beside /etc/sddm.conf and nowhere
# else, which is why this file sits there and is on the sanctioned list in
# docs/architecture.md.
#
# Adoption deliberately does not remove gdm3. The display manager is not in the
# removal set and its configuration is on the never-write list: this drop-in adds
# the Zenith session to the list the login manager offers and changes nothing
# else. A user who wants to go back has one of two sessions to choose from rather
# than a machine that no longer boots.
#
# GreeterEnvironment is what makes the session file found at all:
# /usr/share/wayland-sessions/ is what tells the login manager to set
# XDG_SESSION_TYPE=wayland, and a file in the other directory sets x11.
[Autologin]
# Nothing is enabled by default. Autologin is a per-machine decision and a
# distribution that turns it on for everyone has made it for them.

[Users]
# No forced user either.

[Theme]
Current=zenith
# The theme's own files live under /usr/share/zenith/session/. SDDM reads themes
# from /usr/share/sddm/themes/ and nowhere else, so this directory holds a pointer
# and nothing else — a registration is a pointer, never a place to put content.

[General]
# The greeter runs a Weston kiosk compositor, not Xorg. XWayland in the login
# screen is a second display server with its own failure modes, for no gain a user
# can see. See "what draws the login screen" in docs/architecture.md.
GreeterEnvironment=QT_QPA_PLATFORM=wayland
