# Ordering for the Zenith session.
#
# Placed beside hyprland-session.target, which is the compositor's own anchor
# for "there is a live compositor". A drop-in is used rather than an edited unit
# because the base layer's unit is a shipped file, and this project's rule is that
# a shipped file is never edited in place.
#
# The order is: the compositor, then the portal dispatcher, then the shell. It is
# the easiest order in the session to get wrong, because both sides of it work
# individually and the failure is quiet. See docs/session.md.
[Unit]
Wants=zenith-portal.service
After=zenith-portal.service

[Install]
WantedBy=hyprland-session.target
