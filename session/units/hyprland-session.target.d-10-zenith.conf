# Ordering for the Zenith session.
#
# A drop-in rather than an edited unit, because the compositor's session target
# is a shipped file and this project's rule is that a shipped file is never edited
# in place.
#
# The order is the compositor, then the portal dispatcher, then the shell. See
# docs/session.md, "What starts, in order".
[Unit]
Wants=zenith-portal.service zenith-shell.service
After=zenith-portal.service
