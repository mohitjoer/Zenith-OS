# Zenith OS x86-64-v3, LTO, PGO & BOLT Compiler Configuration
# Used by xbps-src to compile performance-critical core packages (glibc, mesa, hyprland, kernel)

# Enable restricted packages for hardware support (NVIDIA, Steam, microcode)
XBPS_ALLOW_RESTRICTED=yes

# Target modern x86-64-v3 processors (AVX2/FMA/BMI2) with O3 and Link Time Optimization (LTO)
# Preserves relocations (-Wl,--emit-relocs) for LLVM BOLT post-link binary layout optimization
XBPS_TARGET_CFLAGS="-O3 -march=x86-64-v3 -mtune=generic -flto=auto -pipe -fno-plt"
XBPS_TARGET_CXXFLAGS="$XBPS_TARGET_CFLAGS"
XBPS_TARGET_LDFLAGS="-Wl,-O2 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -flto=auto -Wl,--emit-relocs"

# Profile-Guided Optimization (PGO) flags for glibc & mesa training passes
XBPS_PGO_GENERATE_CFLAGS="-fprofile-generate=/var/tmp/pgo -fprofile-dir=/var/tmp/pgo"
XBPS_PGO_USE_CFLAGS="-fprofile-use=/var/tmp/pgo -fprofile-correction -Wno-error=coverage-mismatch"

# Maximize parallel build threads
XBPS_MAKEJOBS=$(nproc 2>/dev/null || echo 4)
