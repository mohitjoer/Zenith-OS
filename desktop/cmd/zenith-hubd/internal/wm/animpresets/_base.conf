# Zenith's base animation curves. The Hub's generated settings can reference any
# of these for per-leaf and window motion on any preset, so they are defined
# before the preset loads and always resolve. A preset or a custom curve defined
# later redefines one of them, and the last definition wins.
bezier = easeOutQuint, 0.23, 1, 0.32, 1
bezier = quick, 0.15, 0, 0.1, 1
bezier = snap, 0.05, 0.9, 0.1, 1.05
bezier = almostLinear, 0.5, 0.5, 0.75, 1
bezier = zenithBloom, 0.16, 1.12, 0.24, 1
bezier = zenithSettle, 0.18, 0.86, 0.24, 1
bezier = zenithWobble, 0.34, 1.56, 0.64, 1
