# Zenith default: a calm settle with a slight bloom on window open.
bezier = easeOutQuint, 0.23, 1, 0.32, 1
bezier = quick, 0.15, 0, 0.1, 1
bezier = almostLinear, 0.5, 0.5, 0.75, 1
bezier = zenithBloom, 0.16, 1.12, 0.24, 1
bezier = zenithSettle, 0.18, 0.86, 0.24, 1

animation = global, 1, 3.2, zenithSettle
animation = windows, 1, 3.2, zenithSettle
animation = windowsIn, 1, 3.8, zenithBloom, popin 78%
animation = windowsOut, 1, 2.4, zenithSettle, popin 86%
animation = border, 1, 3.5, quick
animation = fade, 1, 3, almostLinear
animation = fadeIn, 1, 3.2, almostLinear
animation = fadeOut, 1, 2.2, almostLinear
animation = layers, 1, 7, easeOutQuint, popin 90%
animation = fadeLayersIn, 1, 7, easeOutQuint
animation = fadeLayersOut, 1, 7, easeOutQuint
animation = workspaces, 1, 3.5, easeOutQuint, slide
animation = specialWorkspace, 1, 6, easeOutQuint, slidefadevert 20%
